name: setup-hugo
description: Installs the Hugo extended release the documentation site is built with.
runs:
  using: composite
  steps:
    - name: Install Hugo
      shell: bash
      env:
        HUGO_VERSION: 0.166.0
        HUGO_SHA256: 0e39b901e3f919f1daae05c8ff64f0c14c8a348ef46886d63f8e6d1bb2653885
      run: | # zizmor: ignore[github-env] the action writes fixed paths under RUNNER_TEMP, nothing a caller passes
        curl -fsSLo "$RUNNER_TEMP/hugo.tar.gz" \
          "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
        echo "$HUGO_SHA256  $RUNNER_TEMP/hugo.tar.gz" | sha256sum -c --quiet
        mkdir -p "$RUNNER_TEMP/hugo"
        tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
        echo "$RUNNER_TEMP/hugo" >>"$GITHUB_PATH"
