name: Cut release
run-name: Checking changelog for a due release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.forgejo/workflows/ci.yaml

  cut:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # A tag pushed with the automatic token triggers no workflow, so the checkout keeps agent's token for the push.
      - uses: https://github.com/actions/checkout@v7
        with: # zizmor: ignore[artipacked] the Cut step pushes with this token, and the job uploads no artifact
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - id: changelog
        uses: https://sarak.sh/mikluko/changelog@v1
      - name: Cut
        if: steps.changelog.outputs.due == 'true'
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
