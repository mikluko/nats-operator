name: Documentation site
run-name: "${{ github.event_name == 'push' && format('Publishing the site: {0}', github.event.head_commit.message) || format('Building the site from {0}', github.ref_name) }}"

# A push to main pushes the site's image, which Flux deploys. A manual run
# builds the image and pushes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: sarak.sh/mikluko/nats-operator/docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./.forgejo/actions/setup-hugo
      - uses: ./.forgejo/actions/setup-just
      - name: Site check
        run: just site-check
      - name: Build
        working-directory: docs
        run: hugo --gc --minify
      - name: Log in
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login sarak.sh --username agent --password-stdin
      # Flux deploys the newest main-<sha>-<unix time> tag.
      - name: Image
        env:
          PUSH: ${{ github.event_name == 'push' }}
        run: |
          push=
          if [ "$PUSH" = true ]; then push=--push; fi
          docker buildx build $push \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:main-${GITHUB_SHA::7}-$(date +%s)" \
            --file docs/Containerfile docs
