name: Acceptance suite
run-name: "${{ github.event_name == 'schedule' && (github.event.schedule == '47 5 * * 0' && 'Running the acceptance suite on three Kubernetes clusters, weekly' || 'Running the acceptance suite on two Kubernetes clusters, nightly') || format('Running {0} on {1} from {2}', inputs.stories && format('acceptance stories {0}', inputs.stories) || 'the acceptance suite', inputs.clusters == '1' && 'one Kubernetes cluster' || format('{0} Kubernetes clusters', inputs.clusters), github.ref_name) }}"

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "47 5 * * 0"
  workflow_dispatch:
    inputs:
      stories:
        description: Comma-separated story numbers; empty runs every story.
        type: string
        default: ""
      watch-namespaces:
        description: Install the chart scoped to the stories' namespaces.
        type: boolean
        default: false
      clusters:
        description: Kubernetes clusters; a story spanning more skips.
        type: choice
        options: ["1", "2", "3"]
        default: "1"
  workflow_call:
    inputs:
      stories:
        description: Comma-separated story numbers.
        type: string
        required: true
      watch-namespaces:
        description: Install the chart scoped to the stories' namespaces.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stories:
    runs-on: privileged
    timeout-minutes: 120
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./.forgejo/actions/setup-just
      - uses: https://github.com/azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: https://github.com/ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
        env:
          KO_DOCKER_REPO: localhost/nats-operator
      # The privileged runner is a pod without systemd, so the service is
      # started by hand there; a host with systemd gets its socket unit.
      - name: Rootful podman
        run: |
          if ! sudo test -S /run/podman/podman.sock; then
            if ! command -v podman >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y podman
            fi
            if [ -d /run/systemd/system ]; then
              sudo systemctl enable --now podman.socket
            else
              sudo mkdir -p /run/podman
              sudo sh -c 'nohup podman system service --time=0 unix:///run/podman/podman.sock >/var/log/podman-service.log 2>&1 &'
              for _ in $(seq 1 30); do
                sudo test -S /run/podman/podman.sock && break
                sleep 1
              done
            fi
          fi
          sudo test -S /run/podman/podman.sock
      - name: Stories
        env:
          E2E_CLUSTERS: ${{ github.event_name == 'schedule' && (github.event.schedule == '47 5 * * 0' && '3' || '2') || inputs.clusters || '1' }}
          E2E_STORIES: ${{ inputs.stories }}
          E2E_WATCH_NAMESPACES: ${{ inputs.watch-namespaces }}
        run: sudo --preserve-env=E2E_CLUSTERS,E2E_STORIES,E2E_WATCH_NAMESPACES,HOME,GOPATH,GOMODCACHE,GOCACHE env "PATH=$PATH" just e2e
