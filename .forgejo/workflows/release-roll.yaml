name: Roll release
run-name: ${{ github.event_name == 'push' && format('Releasing {0}', github.ref_name) || format('Dry run of a release from {0}', github.ref_name) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-roll
  cancel-in-progress: false

env:
  REGISTRY: sarak.sh/mikluko/nats-operator
  CHART_REPOSITORY: oci://sarak.sh/mikluko/nats-operator/charts
  MODULE: sarak.sh/mikluko/nats-operator

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.version.outputs.due }}
      reason: ${{ steps.version.outputs.reason }}
      version: ${{ steps.version.outputs.version }}
      tag: v${{ steps.version.outputs.version }}
      prerelease: ${{ steps.changelog.outputs.prerelease }}
      notes: ${{ steps.changelog.outputs.notes }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changelog
        uses: https://forge.sarak.sh/actions/changelog@v1
        with:
          due-prerelease: true
      - id: version
        name: Version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          NEWEST: ${{ steps.changelog.outputs.version }}
          DUE: ${{ steps.changelog.outputs.due }}
          DUE_REASON: ${{ steps.changelog.outputs['due-reason'] }}
        run: |
          due=$DUE
          reason=$DUE_REASON
          version=$NEWEST
          publish=false
          if [ "$EVENT" = push ]; then
            version=${REF_NAME#v}
            if [ -z "$NEWEST" ] || [ "$REF_NAME" != "v$NEWEST" ]; then
              echo "::error::tag $REF_NAME is not the newest version CHANGELOG.md names, ${NEWEST:-which is none}"
              exit 1
            fi
            due=true
            publish=true
            reason="$REF_NAME is the newest version CHANGELOG.md names"
          fi
          echo "::notice::${reason:-$version is due}"
          {
            echo "due=$due"
            echo "reason=$reason"
            echo "version=$version"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"

  images:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: https://github.com/ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}
      - uses: https://github.com/sigstore/cosign-installer@v4.1.2
      - name: Log in
        if: needs.plan.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: printf '%s' "$TOKEN" | ko login sarak.sh --username agent --password-stdin
      - name: Build
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}
          VERSION: ${{ needs.plan.outputs.version }}
          PUSH: ${{ needs.plan.outputs.publish == 'true' }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set --
          for c in cmd/*-controller; do
            set -- "$@" "./$c"
          done
          ko build --base-import-paths --push="$PUSH" \
            --platform linux/amd64,linux/arm64 --tags "$VERSION" \
            --image-label "org.opencontainers.image.source=$SOURCE" \
            --image-label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --image-label "org.opencontainers.image.version=$VERSION" \
            "$@" >"$RUNNER_TEMP/images"
      - id: digests
        name: Digests
        run: |
          digests='[]'
          while read -r ref; do
            name=${ref%@*}
            digest=${ref#*@}
            digests=$(jq -c --arg name "${name%:*}" --arg digest "$digest" \
              '. + [{name: $name, digest: $digest}]' <<<"$digests")
          done <"$RUNNER_TEMP/images"
          echo "digests=$digests" >>"$GITHUB_OUTPUT"
      - name: Sign
        if: needs.plan.outputs.publish == 'true'
        env:
          DIGESTS: ${{ steps.digests.outputs.digests }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          jq -r '.[] | "\(.name)@\(.digest)"' <<<"$DIGESTS" | while read -r ref; do
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$ref"
          done

  chart:
    needs: [plan, images]
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
      - uses: https://github.com/azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: https://github.com/sigstore/cosign-installer@v4.1.2
      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: pin
        name: Pin digests
        env:
          DIGESTS: ${{ needs.images.outputs.digests }}
        run: go run ./hack/pindigests -registry "$REGISTRY" charts/nats-operator/values.yaml <<<"$DIGESTS"
      - name: Package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          helm package charts/nats-operator \
            --version "$VERSION" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP/chart"
      - id: push
        name: Push and sign
        if: needs.plan.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          printf '%s' "$TOKEN" | docker login sarak.sh --username agent --password-stdin
          printf '%s' "$TOKEN" | helm registry login sarak.sh --username agent --password-stdin
          helm push "$RUNNER_TEMP/chart/nats-operator-$VERSION.tgz" "$CHART_REPOSITORY" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest=$(awk '$1 == "Digest:" { print $2 }' "$RUNNER_TEMP/push.log")
          test -n "$digest"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${CHART_REPOSITORY#oci://}/nats-operator@$digest"

  # Last, so a release exists only once every artifact it names does.
  release:
    needs: [plan, images, chart]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
          echo "release $TAG from $GITHUB_SHA:"
          cat "$RUNNER_TEMP/notes.md"
      - name: Release
        if: needs.plan.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          jq -n --arg tag "$TAG" --rawfile body "$RUNNER_TEMP/notes.md" --argjson pre "$PRERELEASE" \
            '{tag_name: $tag, name: $tag, body: $body, prerelease: $pre}' |
            curl --fail-with-body -sS -X POST \
              -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
              -d @- "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases"
      # The proxy fetches a version on first request; asking now lists it on pkg.go.dev.
      - name: Announce to the Go proxy
        if: needs.plan.outputs.publish == 'true'
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: curl --fail-with-body -sS "https://proxy.golang.org/$MODULE/@v/$TAG.info"
