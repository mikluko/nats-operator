---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: natsconsumers.jetstream.nats-operator.io
spec:
  group: jetstream.nats-operator.io
  names:
    kind: NatsConsumer
    listKind: NatsConsumerList
    plural: natsconsumers
    singular: natsconsumer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Consumer
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: NatsConsumer is a JetStream consumer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NatsConsumerSpec is the desired state of a consumer. deliverPolicy,
              ackPolicy, replayPolicy, optStartSeq, optStartTime, heartbeat, flowControl
              and maxWaiting are immutable unless recreateOnImmutableChange is set. The
              fields of the inlined ConsumerConfig mirror nats.go's
              jetstream.ConsumerConfig and mean what their like-named fields there mean: https://pkg.go.dev/github.com/nats-io/nats.go/jetstream#ConsumerConfig.
            properties:
              ackPolicy:
                description: AckPolicy is how a consumer's messages are acknowledged.
                enum:
                - None
                - All
                - Explicit
                type: string
              ackWait:
                type: string
              adoptionPolicy:
                default: Never
                description: |-
                  AdoptionPolicy is what happens to an object of the same name the
                  controller does not own.
                enum:
                - Never
                - Adopt
                - AdoptOrCreate
                type: string
              backOff:
                items:
                  type: string
                type: array
              connectionRef:
                description: |-
                  ConnectionRef names the NatsConnection whose credentials decide the
                  account, the stream's own when StreamRef is set and this is omitted;
                  it is immutable.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced object, the referrer's own when omitted.
                      Another namespace is admitted only by a NatsReferenceGrant there.
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Delete
                description: DeletionPolicy is what deleting the resource does to
                  the consumer.
                enum:
                - Retain
                - Delete
                type: string
              deliverGroup:
                type: string
              deliverPolicy:
                description: DeliverPolicy is where a consumer starts.
                enum:
                - All
                - Last
                - New
                - ByStartSequence
                - ByStartTime
                - LastPerSubject
                type: string
              deliverSubject:
                type: string
              description:
                type: string
              filterSubject:
                type: string
              filterSubjects:
                items:
                  type: string
                type: array
              flowControl:
                type: boolean
              headersOnly:
                type: boolean
              heartbeat:
                type: string
              inactiveThreshold:
                type: string
              maxAckPending:
                format: int64
                type: integer
              maxDeliver:
                format: int64
                type: integer
              maxRequestBatch:
                format: int64
                type: integer
              maxRequestExpires:
                type: string
              maxRequestMaxBytes:
                format: int64
                type: integer
              maxWaiting:
                format: int64
                type: integer
              memoryStorage:
                type: boolean
              metadata:
                additionalProperties:
                  type: string
                description: |-
                  Metadata is merged with the ownership marker, which the controller
                  owns.
                type: object
              name:
                description: Name is the server-side durable name, metadata.name when
                  omitted.
                minLength: 1
                type: string
              optStartSeq:
                format: int64
                minimum: 0
                type: integer
              optStartTime:
                format: date-time
                type: string
              pauseUntil:
                format: date-time
                type: string
              pinnedTTL:
                type: string
              priorityGroups:
                items:
                  type: string
                type: array
              priorityPolicy:
                description: PriorityPolicy is how a pull consumer picks among waiting
                  clients.
                enum:
                - None
                - Overflow
                - PinnedClient
                - Prioritized
                type: string
              rateLimit:
                description: RateLimit is in bits per second.
                format: int64
                minimum: 0
                type: integer
              recreateOnImmutableChange:
                description: |-
                  RecreateOnImmutableChange lets an immutable field change, by deleting
                  and recreating the consumer, which discards its delivery state.
                type: boolean
              replayPolicy:
                description: ReplayPolicy is the pace a consumer replays at.
                enum:
                - Instant
                - Original
                type: string
              replicas:
                format: int32
                maximum: 5
                minimum: 0
                type: integer
              sampleFrequency:
                type: string
              stream:
                description: |-
                  Stream is the server-side name of a stream with no resource; it is
                  immutable.
                minLength: 1
                type: string
              streamRef:
                description: |-
                  StreamRef names the NatsStream the consumer waits for and consumes;
                  it is immutable.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced object, the referrer's own when omitted.
                      Another namespace is admitted only by a NatsReferenceGrant there.
                    type: string
                required:
                - name
                type: object
              terminalPolicy:
                default: Hold
                description: TerminalPolicy is what a Terminal condition waits for.
                enum:
                - Hold
                - Retry
                type: string
            type: object
            x-kubernetes-validations:
            - message: set exactly one of stream and streamRef
              rule: has(self.stream) != has(self.streamRef)
            - message: connectionRef is required unless streamRef is set
              rule: has(self.connectionRef) || has(self.streamRef)
            - message: connectionRef is immutable
              rule: has(self.connectionRef) == has(oldSelf.connectionRef) && (!has(self.connectionRef)
                || self.connectionRef == oldSelf.connectionRef)
            - message: stream is immutable
              rule: has(self.stream) == has(oldSelf.stream) && (!has(self.stream)
                || self.stream == oldSelf.stream)
            - message: streamRef is immutable
              rule: has(self.streamRef) == has(oldSelf.streamRef) && (!has(self.streamRef)
                || self.streamRef == oldSelf.streamRef)
            - message: deliverPolicy is immutable unless recreateOnImmutableChange
                is set
              rule: (has(self.recreateOnImmutableChange) && self.recreateOnImmutableChange)
                || !has(self.deliverPolicy) || !has(oldSelf.deliverPolicy) || self.deliverPolicy
                == oldSelf.deliverPolicy
            - message: ackPolicy is immutable unless recreateOnImmutableChange is
                set
              rule: (has(self.recreateOnImmutableChange) && self.recreateOnImmutableChange)
                || !has(self.ackPolicy) || !has(oldSelf.ackPolicy) || self.ackPolicy
                == oldSelf.ackPolicy
            - message: replayPolicy is immutable unless recreateOnImmutableChange
                is set
              rule: (has(self.recreateOnImmutableChange) && self.recreateOnImmutableChange)
                || !has(self.replayPolicy) || !has(oldSelf.replayPolicy) || self.replayPolicy
                == oldSelf.replayPolicy
            - message: optStartSeq is immutable unless recreateOnImmutableChange is
                set
              rule: (has(self.recreateOnImmutableChange) && self.recreateOnImmutableChange)
                || !has(self.optStartSeq) || !has(oldSelf.optStartSeq) || self.optStartSeq
                == oldSelf.optStartSeq
            - message: optStartTime is immutable unless recreateOnImmutableChange
                is set
              rule: (has(self.recreateOnImmutableChange) && self.recreateOnImmutableChange)
                || !has(self.optStartTime) || !has(oldSelf.optStartTime) || self.optStartTime
                == oldSelf.optStartTime
            - message: heartbeat is immutable unless recreateOnImmutableChange is
                set
              rule: (has(self.recreateOnImmutableChange) && self.recreateOnImmutableChange)
                || !has(self.heartbeat) || !has(oldSelf.heartbeat) || duration(self.heartbeat)
                == duration(oldSelf.heartbeat)
            - message: flowControl is immutable unless recreateOnImmutableChange is
                set
              rule: (has(self.recreateOnImmutableChange) && self.recreateOnImmutableChange)
                || !has(self.flowControl) || !has(oldSelf.flowControl) || self.flowControl
                == oldSelf.flowControl
            - message: maxWaiting is immutable unless recreateOnImmutableChange is
                set
              rule: (has(self.recreateOnImmutableChange) && self.recreateOnImmutableChange)
                || !has(self.maxWaiting) || !has(oldSelf.maxWaiting) || self.maxWaiting
                == oldSelf.maxWaiting
          status:
            description: NatsConsumerStatus is the observed state of a consumer.
            properties:
              conditions:
                description: 'Conditions: Ready, Synced, Terminal, Adopted.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncedTime:
                description: LastSyncedTime is when the server object was last compared
                  to spec.
                format: date-time
                type: string
              nextCheckTime:
                description: |-
                  NextCheckTime is when a Terminal condition under the Retry policy is
                  next rechecked.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              ownership:
                description: Ownership is the ownership marker on the server object.
                properties:
                  origin:
                    description: Origin is how the object came to be owned.
                    enum:
                    - Created
                    - Adopted
                    type: string
                  uid:
                    description: UID is the owning resource's UID, as written in the
                      object's metadata.
                    type: string
                type: object
              server:
                description: Server is the consumer's state on the server.
                properties:
                  created:
                    description: Created is when the consumer was created on the server.
                    format: date-time
                    type: string
                  leader:
                    description: Leader is the server leading the consumer's group.
                    type: string
                  replicas:
                    description: Replicas are the followers.
                    items:
                      description: ReplicaStatus is one replica of a Raft group.
                      properties:
                        current:
                          description: Current reports whether the replica is current.
                          type: boolean
                        lag:
                          description: Lag is how many operations the replica is behind.
                          format: int64
                          type: integer
                        name:
                          description: Name is the server_name of the server holding
                            the replica.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the consumer name is immutable
          rule: '(has(self.spec.name) ? self.spec.name : self.metadata.name) == (has(oldSelf.spec.name)
            ? oldSelf.spec.name : oldSelf.metadata.name)'
    served: true
    storage: true
    subresources:
      status: {}
