---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: natsusers.auth.nats.mikluko.io
spec:
  group: auth.nats.mikluko.io
  names:
    kind: NatsUser
    listKind: NatsUserList
    plural: natsusers
    singular: natsuser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.accountRef.name
      name: Account
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: NatsUser is a user of an account.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NatsUserSpec is the desired state of a user.
            properties:
              accountRef:
                description: AccountRef names the account the user belongs to.
                properties:
                  kind:
                    description: Kind of the account.
                    enum:
                    - NatsAccount
                    - NatsSystemAccount
                    type: string
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced object, the referrer's own when omitted.
                      Another namespace is admitted only by a NatsReferenceGrant there.
                    type: string
                required:
                - kind
                - name
                type: object
              connectionTypes:
                description: ConnectionTypes restricts how the user may connect; empty
                  allows any.
                items:
                  description: ConnectionType is a NATS connection type a user may
                    connect as.
                  enum:
                  - STANDARD
                  - WEBSOCKET
                  - LEAFNODE
                  - LEAFNODE_WS
                  - MQTT
                  - MQTT_WS
                  - IN_PROCESS
                  type: string
                type: array
                x-kubernetes-list-type: set
              credentials:
                description: |-
                  Credentials is where the user's creds are written, in the shape a
                  NatsConnection reads.
                properties:
                  secretKeyRef:
                    description: SecretKeyRef selects the creds file.
                    properties:
                      key:
                        default: user.creds
                        description: Key within the Secret, the key a NatsUser writes
                          by default.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretKeyRef
                type: object
              permissions:
                description: Permissions are the user's publish and subscribe permissions.
                properties:
                  publish:
                    description: Publish permissions.
                    properties:
                      allow:
                        description: Allow lists subjects allowed.
                        items:
                          type: string
                        type: array
                      deny:
                        description: Deny lists subjects denied.
                        items:
                          type: string
                        type: array
                    type: object
                  subscribe:
                    description: Subscribe permissions.
                    properties:
                      allow:
                        description: Allow lists subjects allowed.
                        items:
                          type: string
                        type: array
                      deny:
                        description: Deny lists subjects denied.
                        items:
                          type: string
                        type: array
                    type: object
                type: object
              preset:
                description: |-
                  Preset is a named permission set in place of Permissions and
                  ConnectionTypes.
                enum:
                - cluster-controller
                - jetstream-controller
                - auth-controller
                - readonly
                - leafnode
                type: string
              publicKey:
                description: |-
                  PublicKey is a key whose seed the client holds; the user then gets a
                  signed JWT in status and no creds Secret.
                minLength: 1
                type: string
            required:
            - accountRef
            type: object
            x-kubernetes-validations:
            - message: preset and permissions are mutually exclusive
              rule: '!has(self.preset) || !has(self.permissions)'
            - message: preset and connectionTypes are mutually exclusive
              rule: '!has(self.preset) || !has(self.connectionTypes)'
            - message: publicKey and credentials are mutually exclusive
              rule: '!has(self.publicKey) || !has(self.credentials)'
            - message: a controller preset is for a NatsSystemAccount user
              rule: '!has(self.preset) || !(self.preset in [''cluster-controller'',
                ''jetstream-controller'', ''auth-controller'']) || self.accountRef.kind
                == ''NatsSystemAccount'''
            - message: the readonly preset is for a NatsAccount user
              rule: '!has(self.preset) || self.preset != ''readonly'' || self.accountRef.kind
                == ''NatsAccount'''
          status:
            description: NatsUserStatus is the observed state of a user.
            properties:
              conditions:
                description: Conditions describe the user's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              jwt:
                description: JWT is the user JWT, published for a user that brings
                  its own key.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              publicKey:
                description: PublicKey is the user's public key.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
