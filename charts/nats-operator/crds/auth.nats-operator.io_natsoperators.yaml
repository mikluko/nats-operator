---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: natsoperators.auth.nats-operator.io
spec:
  group: auth.nats-operator.io
  names:
    kind: NatsOperator
    listKind: NatsOperatorList
    plural: natsoperators
    singular: natsoperator
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: NatsOperator is a NATS operator the auth controller signs for.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NatsOperatorSpec is the desired state of a NATS operator.
            properties:
              jwt:
                description: |-
                  JWT is a NATS operator JWT signed elsewhere, keeping the identity key
                  offline.
                minLength: 1
                type: string
              keys:
                description: Keys adopts existing seeds.
                properties:
                  identity:
                    description: Identity is the identity key's seed.
                    properties:
                      secretKeyRef:
                        description: SecretKeyRef selects the seed.
                        properties:
                          key:
                            description: Key within the Secret.
                            minLength: 1
                            type: string
                          name:
                            description: Name of a Secret in the referrer's namespace.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - secretKeyRef
                    type: object
                  signing:
                    description: Signing are the signing keys' seeds.
                    items:
                      description: SigningKey is a signing key's seed.
                      properties:
                        name:
                          description: Name identifies the key within the list.
                          minLength: 1
                          type: string
                        retiring:
                          description: |-
                            Retiring keeps the key listed, so what it signed stays valid, and
                            signs nothing new with it. Nothing removes a retiring key from the list.
                          type: boolean
                        scope:
                          description: |-
                            Scope makes the key a scoped signing key of an account: it signs only
                            the NatsUsers naming the scope's role, and the servers hold each of
                            them to the scope. A NATS operator's signing key takes none.
                          properties:
                            connectionTypes:
                              description: |-
                                ConnectionTypes restricts how the key's users may connect; empty
                                allows any.
                              items:
                                description: ConnectionType is a NATS connection type
                                  a user may connect as.
                                enum:
                                - STANDARD
                                - WEBSOCKET
                                - LEAFNODE
                                - LEAFNODE_WS
                                - MQTT
                                - MQTT_WS
                                - IN_PROCESS
                                type: string
                              type: array
                              x-kubernetes-list-type: set
                            limits:
                              description: |-
                                Limits are the limits of each of the key's users; an omitted limit is
                                unlimited.
                              properties:
                                payload:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Payload is the maximum message payload.
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                subscriptions:
                                  description: Subscriptions is the maximum number
                                    of subscriptions.
                                  format: int64
                                  type: integer
                              type: object
                            permissions:
                              description: |-
                                Permissions are the publish and subscribe permissions of the key's
                                users.
                              properties:
                                publish:
                                  description: Publish are the subjects the user may
                                    publish to.
                                  properties:
                                    allow:
                                      description: Allow are the subjects permitted;
                                        empty, every subject is.
                                      items:
                                        type: string
                                      type: array
                                    deny:
                                      description: Deny are the subjects refused,
                                        even where Allow matches them.
                                      items:
                                        type: string
                                      type: array
                                  type: object
                                subscribe:
                                  description: Subscribe are the subjects the user
                                    may subscribe to.
                                  properties:
                                    allow:
                                      description: Allow are the subjects permitted;
                                        empty, every subject is.
                                      items:
                                        type: string
                                      type: array
                                    deny:
                                      description: Deny are the subjects refused,
                                        even where Allow matches them.
                                      items:
                                        type: string
                                      type: array
                                  type: object
                              type: object
                            role:
                              description: |-
                                Role names the scope; a NatsUser whose spec.role is this is signed by
                                the first key of the role that is not retiring.
                              minLength: 1
                              type: string
                          required:
                          - role
                          type: object
                        secretKeyRef:
                          description: SecretKeyRef selects the seed.
                          properties:
                            key:
                              description: Key within the Secret.
                              minLength: 1
                              type: string
                            name:
                              description: Name of a Secret in the referrer's namespace.
                              minLength: 1
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - name
                      - secretKeyRef
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
              systemAccountRef:
                description: SystemAccountRef names the NatsSystemAccount the NATS
                  operator JWT names.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced object, the referrer's own when omitted.
                      Another namespace is admitted only by a NatsReferenceGrant there.
                    type: string
                required:
                - name
                type: object
            required:
            - systemAccountRef
            type: object
            x-kubernetes-validations:
            - message: jwt and keys.identity are mutually exclusive
              rule: '!has(self.jwt) || !has(self.keys) || !has(self.keys.identity)'
            - message: jwt requires at least one signing key
              rule: '!has(self.jwt) || (has(self.keys) && has(self.keys.signing) &&
                size(self.keys.signing) > 0)'
            - message: a NATS operator's signing key takes no scope
              rule: '!has(self.keys) || !has(self.keys.signing) || self.keys.signing.all(k,
                !has(k.scope))'
          status:
            description: NatsOperatorStatus is the observed state of a NATS operator.
            properties:
              conditions:
                description: |-
                  Conditions: Ready, ReferencesResolved, RetiringKeysInUse, and where it
                  applies RevocationsUnrecovered.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deletedAccounts:
                description: |-
                  DeletedAccounts are the accounts deleted or no longer admitted while a
                  server may hold a valid JWT for one; the delete is re-sent to each
                  joining server until that JWT expires or an admitted account holds its
                  key again.
                items:
                  description: DeletedAccount is an account deleted from the resolvers.
                  properties:
                    expires:
                      description: |-
                        Expires is when the account's last JWT expires; omitted, it never
                        does.
                      format: date-time
                      type: string
                    publicKey:
                      description: PublicKey of the account.
                      type: string
                  required:
                  - publicKey
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - publicKey
                x-kubernetes-list-type: map
              jwt:
                description: JWT is the NATS operator JWT.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              publicKey:
                description: PublicKey is the identity key's public key.
                type: string
              seedSecrets:
                description: SeedSecrets name the Secrets holding the generated seeds.
                properties:
                  identity:
                    description: Identity names the identity seed's Secret.
                    type: string
                  signing:
                    description: Signing name the signing seeds' Secrets.
                    items:
                      type: string
                    type: array
                type: object
              signingKeys:
                description: SigningKeys are the signing keys' public keys.
                items:
                  type: string
                type: array
              systemAccount:
                description: SystemAccount is the system account the NATS operator
                  JWT names.
                properties:
                  jwt:
                    description: JWT of the system account.
                    type: string
                  name:
                    description: Name of the NatsSystemAccount spec.systemAccountRef
                      resolves to.
                    type: string
                  publicKey:
                    description: PublicKey of the system account.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
