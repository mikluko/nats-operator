suite: cluster-controller
templates:
  - templates/cluster-controller.yaml
release:
  name: rel
  namespace: nats
tests:
  - it: renders the ServiceAccount, RBAC and Deployment with the other two disabled
    set:
      auth.enabled: false
      jetstream.enabled: false
    asserts:
      - hasDocuments:
          count: 6
      - containsDocument: {kind: ServiceAccount, apiVersion: v1, name: rel-cluster-controller, namespace: nats, any: true}
      - containsDocument: {kind: ClusterRole, apiVersion: rbac.authorization.k8s.io/v1, name: rel-cluster-controller, any: true}
      - containsDocument: {kind: ClusterRoleBinding, apiVersion: rbac.authorization.k8s.io/v1, name: rel-cluster-controller, any: true}
      - containsDocument: {kind: Role, apiVersion: rbac.authorization.k8s.io/v1, name: rel-cluster-controller-leader-election, namespace: nats, any: true}
      - containsDocument: {kind: RoleBinding, apiVersion: rbac.authorization.k8s.io/v1, name: rel-cluster-controller-leader-election, namespace: nats, any: true}
      - containsDocument: {kind: Deployment, apiVersion: apps/v1, name: rel-cluster-controller, namespace: nats, any: true}
  - it: renders nothing while cluster.enabled is false
    set:
      cluster.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: grants exactly its ClusterRole rules
    documentSelector: {path: kind, value: ClusterRole}
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [""]
              resources: [persistentvolumeclaims]
              verbs: [delete, get, list, watch]
            - apiGroups: [""]
              resources: [secrets, services]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [apps]
              resources: [statefulsets]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [authentication.k8s.io]
              resources: [tokenreviews]
              verbs: [create]
            - apiGroups: [authorization.k8s.io]
              resources: [subjectaccessreviews]
              verbs: [create]
            - apiGroups: [cert-manager.io]
              resources: [certificates]
              verbs: [create, delete, get, update]
            - apiGroups: [cluster.nats.mikluko.io]
              resources: [natsclusters]
              verbs: [get, list, patch, watch]
            - apiGroups: [cluster.nats.mikluko.io]
              resources: [natsclusters/finalizers]
              verbs: [update]
            - apiGroups: [cluster.nats.mikluko.io]
              resources: [natsclusters/status]
              verbs: [patch]
            - apiGroups: [events.k8s.io]
              resources: [events]
              verbs: [create, patch]
            - apiGroups: [nats.mikluko.io]
              resources: [natsaccounttrusts, natsconnections, natsoperatortrusts]
              verbs: [get, list, watch]
            - apiGroups: [nats.mikluko.io]
              resources: [natsreferencegrants]
              verbs: [list, watch]
            - apiGroups: [networking.k8s.io]
              resources: [networkpolicies]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [policy]
              resources: [poddisruptionbudgets]
              verbs: [create, get, list, update, watch]
  - it: binds its ClusterRole to its ServiceAccount
    documentSelector: {path: kind, value: ClusterRoleBinding}
    asserts:
      - equal:
          path: roleRef
          value: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: rel-cluster-controller}
      - equal:
          path: subjects
          value: [{kind: ServiceAccount, name: rel-cluster-controller, namespace: nats}]
  - it: grants creating Leases, and reading and renewing its own, and writing Events, for leader election
    documentSelector: {path: kind, value: Role}
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [create]
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              resourceNames: [rel-cluster.nats.mikluko.io]
              verbs: [get, update, patch]
            - apiGroups: [""]
              resources: [events]
              verbs: [create, patch]
  - it: runs under its ServiceAccount with leader election on its API group
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: rel-cluster-controller
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-election-id=rel-cluster.nats.mikluko.io
  - it: tags its image with the chart's appVersion by default
    chart:
      appVersion: 9.8.7
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mikluko/nats-operator/cluster-controller:9.8.7
  - it: tags its image with cluster.image.tag when set
    set:
      cluster.image.tag: v9
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mikluko/nats-operator/cluster-controller:v9
  - it: pins its image to cluster.image.digest after the tag when set
    chart:
      appVersion: 9.8.7
    set:
      cluster.image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mikluko/nats-operator/cluster-controller:9.8.7@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  - it: keeps cluster.image.digest on a cluster.image.tag equal to appVersion
    chart:
      appVersion: 9.8.7
    set:
      cluster.image.tag: 9.8.7
      cluster.image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mikluko/nats-operator/cluster-controller:9.8.7@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  - it: drops cluster.image.digest on a cluster.image.tag other than appVersion
    chart:
      appVersion: 9.8.7
    set:
      cluster.image.tag: v9
      cluster.image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mikluko/nats-operator/cluster-controller:v9
  - it: refuses more than one replica while leaderElection.enabled is false
    set:
      leaderElection.enabled: false
      cluster.replicas: 2
    asserts:
      - failedTemplate:
          errorMessage: "cluster.replicas is 2: more than one replica needs leaderElection.enabled"
  - it: refuses an extraArgs entry setting --leader-election-id
    set:
      extraArgs: [--leader-election-id=other]
    asserts:
      - failedTemplate:
          errorMessage: 'extraArgs entry "--leader-election-id=other" sets the lease name, which the chart fixes as rel-cluster.nats.mikluko.io'
  - it: refuses a controller's extraArgs entry setting -leader-election-id, its value apart
    set:
      cluster.extraArgs: [-leader-election-id, other]
    asserts:
      - failedTemplate:
          errorMessage: 'extraArgs entry "-leader-election-id" sets the lease name, which the chart fixes as rel-cluster.nats.mikluko.io'
  - it: renders an extraArgs entry that only starts like --leader-election-id
    set:
      extraArgs: [--leader-election-idle=1]
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-election-idle=1
  - it: renders more than one replica while leaderElection.enabled is set
    set:
      cluster.replicas: 2
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: spec.replicas, value: 2}
  - it: drops the leader election Role and passes --leader-elect=false while leaderElection.enabled is false
    set:
      leaderElection.enabled: false
    asserts:
      - hasDocuments:
          count: 4
      - containsDocument: {kind: Role, apiVersion: rbac.authorization.k8s.io/v1, name: rel-cluster-controller-leader-election, namespace: nats, any: true}
        not: true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=false
        documentSelector: {path: kind, value: Deployment}
  - it: passes no --system-connection, even with auth.systemConnection set
    set:
      auth.systemConnection: nats/auth-controller
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 4
  - it: passes no --allow-gateway-without-tls by default
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --allow-gateway-without-tls
  - it: passes cluster.allowGatewayWithoutTLS as --allow-gateway-without-tls, before extraArgs
    set:
      cluster.allowGatewayWithoutTLS: true
      cluster.extraArgs: [--zap-devel]
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[4]
          value: --allow-gateway-without-tls
      - equal:
          path: spec.template.spec.containers[0].args[5]
          value: --zap-devel
  - it: sets no annotations, nodeSelector or affinity by default
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notExists: {path: metadata.annotations}
      - notExists: {path: spec.template.metadata.annotations}
      - notExists: {path: spec.template.spec.nodeSelector}
      - notExists: {path: spec.template.spec.affinity}
  - it: puts annotations on the Deployment, cluster.annotations over the global ones
    set:
      annotations: {a: global, b: global}
      cluster.annotations: {b: cluster, c: cluster}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: metadata.annotations
          value: {a: global, b: cluster, c: cluster}
      - notExists: {path: spec.template.metadata.annotations}
  - it: puts podAnnotations on the pod template, cluster.podAnnotations over the global ones
    set:
      podAnnotations: {a: global, b: global}
      cluster.podAnnotations: {b: cluster, c: cluster}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value: {a: global, b: cluster, c: cluster}
      - notExists: {path: metadata.annotations}
  - it: sets nodeSelector, cluster.nodeSelector over the global one
    set:
      nodeSelector: {a: global, b: global}
      cluster.nodeSelector: {b: cluster, c: cluster}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {a: global, b: cluster, c: cluster}
  - it: sets affinity, each key of cluster.affinity replacing the global one whole
    set:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{key: pool, operator: In, values: [system]}]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app: global}}
      cluster.affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector: {matchLabels: {app: cluster}}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions: [{key: pool, operator: In, values: [system]}]
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: topology.kubernetes.io/zone
                    labelSelector: {matchLabels: {app: cluster}}
  - it: takes none of another controller's annotations, nodeSelector or affinity
    set:
      auth.annotations: {a: auth}
      auth.podAnnotations: {a: auth}
      auth.nodeSelector: {a: auth}
      auth.affinity: {podAntiAffinity: {}}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notExists: {path: metadata.annotations}
      - notExists: {path: spec.template.metadata.annotations}
      - notExists: {path: spec.template.spec.nodeSelector}
      - notExists: {path: spec.template.spec.affinity}
  - it: sets no tolerations, priorityClassName or topologySpreadConstraints, and of env only GOMEMLIMIT, by default
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notExists: {path: spec.template.spec.tolerations}
      - notExists: {path: spec.template.spec.priorityClassName}
      - notExists: {path: spec.template.spec.topologySpreadConstraints}
      - equal:
          path: spec.template.spec.containers[0].env
          value: [{name: GOMEMLIMIT, valueFrom: {resourceFieldRef: {resource: limits.memory}}}]
  - it: sets no GOMEMLIMIT without a memory limit
    set:
      cluster.resources.limits: null
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env
  - it: lets an env entry named GOMEMLIMIT replace the one its memory limit sets
    set:
      cluster.env: [{name: GOMEMLIMIT, value: 200MiB}]
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value: [{name: GOMEMLIMIT, value: 200MiB}]
  - it: takes the global tolerations, priorityClassName and topologySpreadConstraints
    set:
      tolerations: [{key: pool, operator: Equal, value: system, effect: NoSchedule}]
      priorityClassName: system-cluster-critical
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value: [{key: pool, operator: Equal, value: system, effect: NoSchedule}]
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value: [{maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway}]
  - it: replaces the global tolerations, priorityClassName and topologySpreadConstraints whole with its own
    set:
      tolerations: [{key: a, operator: Exists}]
      priorityClassName: global
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway}
      cluster.tolerations: [{key: b, operator: Exists}]
      cluster.priorityClassName: own
      cluster.topologySpreadConstraints:
        - {maxSkew: 2, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.tolerations
          value: [{key: b, operator: Exists}]
      - equal:
          path: spec.template.spec.priorityClassName
          value: own
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value: [{maxSkew: 2, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule}]
  - it: appends the global extraArgs, then its own, after the chart's flags
    set:
      extraArgs: [--zap-log-level=debug]
      cluster.extraArgs: [--zap-encoder=console]
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --leader-elect=true
            - --leader-election-id=rel-cluster.nats.mikluko.io
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --zap-log-level=debug
            - --zap-encoder=console
  - it: sets the global env, its own entries replacing those of the same name
    set:
      env: [{name: A, value: global}, {name: B, value: global}]
      cluster.env: [{name: B, value: own}, {name: C, value: own}]
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value: [{name: GOMEMLIMIT, valueFrom: {resourceFieldRef: {resource: limits.memory}}}, {name: A, value: global}, {name: B, value: own}, {name: C, value: own}]
  - it: exposes only the metrics and probes ports by default
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value: [{name: metrics, containerPort: 8080}, {name: probes, containerPort: 8081}]
  - it: serves its OpenTelemetry metrics on the pod IP's port 9464 while metrics.prometheus.enabled is set
    set:
      metrics.service.enabled: true
      metrics.prometheus.enabled: true
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - {name: GOMEMLIMIT, valueFrom: {resourceFieldRef: {resource: limits.memory}}}
            - {name: OTEL_METRICS_EXPORTER, value: prometheus}
            - {name: OTEL_EXPORTER_PROMETHEUS_HOST, value: 0.0.0.0}
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
            - {name: otel-metrics, containerPort: 9464}
  - it: lets the global env, then its own, replace the variables metrics.prometheus.enabled sets
    set:
      metrics.service.enabled: true
      metrics.prometheus.enabled: true
      env: [{name: OTEL_EXPORTER_PROMETHEUS_HOST, value: global}, {name: A, value: global}]
      cluster.env: [{name: OTEL_METRICS_EXPORTER, value: own}]
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - {name: GOMEMLIMIT, valueFrom: {resourceFieldRef: {resource: limits.memory}}}
            - {name: OTEL_EXPORTER_PROMETHEUS_HOST, value: global}
            - {name: A, value: global}
            - {name: OTEL_METRICS_EXPORTER, value: own}
  - it: takes none of another controller's tolerations, extraArgs or env
    set:
      auth.tolerations: [{key: a, operator: Exists}]
      auth.extraArgs: [--zap-devel]
      auth.env: [{name: A, value: auth}]
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notExists: {path: spec.template.spec.tolerations}
      - equal:
          path: spec.template.spec.containers[0].env
          value: [{name: GOMEMLIMIT, valueFrom: {resourceFieldRef: {resource: limits.memory}}}]
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 4
  - it: renders a Role and RoleBinding per watched namespace while watchNamespaces is set
    set:
      watchNamespaces: [a, b]
    asserts:
      - hasDocuments:
          count: 10
      - containsDocument: {kind: Role, apiVersion: rbac.authorization.k8s.io/v1, name: rel-cluster-controller, namespace: a, any: true}
      - containsDocument: {kind: Role, apiVersion: rbac.authorization.k8s.io/v1, name: rel-cluster-controller, namespace: b, any: true}
      - containsDocument: {kind: RoleBinding, apiVersion: rbac.authorization.k8s.io/v1, name: rel-cluster-controller, namespace: a, any: true}
      - containsDocument: {kind: RoleBinding, apiVersion: rbac.authorization.k8s.io/v1, name: rel-cluster-controller, namespace: b, any: true}
  - it: keeps only the cluster-scoped rules in its ClusterRole while watchNamespaces is set
    set:
      watchNamespaces: [a]
    documentSelector: {path: kind, value: ClusterRole}
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [authentication.k8s.io]
              resources: [tokenreviews]
              verbs: [create]
            - apiGroups: [authorization.k8s.io]
              resources: [subjectaccessreviews]
              verbs: [create]
  - it: grants the namespaced rules in each watched namespace
    set:
      watchNamespaces: [a]
      leaderElection.enabled: false
    documentSelector: {path: kind, value: Role}
    asserts:
      - equal:
          path: metadata.namespace
          value: a
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [""]
              resources: [persistentvolumeclaims]
              verbs: [delete, get, list, watch]
            - apiGroups: [""]
              resources: [secrets, services]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [apps]
              resources: [statefulsets]
              verbs: [create, delete, get, list, patch, update, watch]
            - apiGroups: [cert-manager.io]
              resources: [certificates]
              verbs: [create, delete, get, update]
            - apiGroups: [cluster.nats.mikluko.io]
              resources: [natsclusters]
              verbs: [get, list, patch, watch]
            - apiGroups: [cluster.nats.mikluko.io]
              resources: [natsclusters/finalizers]
              verbs: [update]
            - apiGroups: [cluster.nats.mikluko.io]
              resources: [natsclusters/status]
              verbs: [patch]
            - apiGroups: [events.k8s.io]
              resources: [events]
              verbs: [create, patch]
            - apiGroups: [nats.mikluko.io]
              resources: [natsaccounttrusts, natsconnections, natsoperatortrusts]
              verbs: [get, list, watch]
            - apiGroups: [nats.mikluko.io]
              resources: [natsreferencegrants]
              verbs: [list, watch]
            - apiGroups: [networking.k8s.io]
              resources: [networkpolicies]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [policy]
              resources: [poddisruptionbudgets]
              verbs: [create, get, list, update, watch]
  - it: binds each namespace's Role to its ServiceAccount
    set:
      watchNamespaces: [a]
    documentSelector: {path: kind, value: RoleBinding, matchMany: true}
    asserts:
      - equal:
          path: subjects
          value: [{kind: ServiceAccount, name: rel-cluster-controller, namespace: nats}]
  - it: passes watchNamespaces as --watch-namespaces
    set:
      watchNamespaces: [a, b]
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --watch-namespaces=a,b
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 5
