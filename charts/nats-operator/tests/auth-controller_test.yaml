suite: auth-controller
templates:
  - templates/auth-controller.yaml
release:
  name: rel
  namespace: nats
tests:
  - it: renders the ServiceAccount, RBAC and Deployment with the other two disabled
    set:
      cluster.enabled: false
      jetstream.enabled: false
    asserts:
      - hasDocuments:
          count: 6
      - containsDocument: {kind: ServiceAccount, apiVersion: v1, name: rel-auth-controller, namespace: nats, any: true}
      - containsDocument: {kind: ClusterRole, apiVersion: rbac.authorization.k8s.io/v1, name: rel-auth-controller, any: true}
      - containsDocument: {kind: ClusterRoleBinding, apiVersion: rbac.authorization.k8s.io/v1, name: rel-auth-controller, any: true}
      - containsDocument: {kind: Role, apiVersion: rbac.authorization.k8s.io/v1, name: rel-auth-controller-leader-election, namespace: nats, any: true}
      - containsDocument: {kind: RoleBinding, apiVersion: rbac.authorization.k8s.io/v1, name: rel-auth-controller-leader-election, namespace: nats, any: true}
      - containsDocument: {kind: Deployment, apiVersion: apps/v1, name: rel-auth-controller, namespace: nats, any: true}
  - it: renders nothing while auth.enabled is false
    set:
      auth.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: grants exactly its ClusterRole rules
    documentSelector: {path: kind, value: ClusterRole}
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              verbs: [create, delete, get, list, update, watch]
            - apiGroups: [auth.nats.mikluko.io]
              resources: [natsaccounts, natsusers]
              verbs: [get, list, patch, watch]
            - apiGroups: [auth.nats.mikluko.io]
              resources: [natsaccounts/finalizers, natsaccounts/status, natsoperators/finalizers, natsoperators/status, natssystemaccounts/finalizers, natssystemaccounts/status, natsusers/finalizers, natsusers/status]
              verbs: [update]
            - apiGroups: [auth.nats.mikluko.io]
              resources: [natsoperators, natssystemaccounts]
              verbs: [get, list, watch]
            - apiGroups: [authentication.k8s.io]
              resources: [tokenreviews]
              verbs: [create]
            - apiGroups: [authorization.k8s.io]
              resources: [subjectaccessreviews]
              verbs: [create]
            - apiGroups: [events.k8s.io]
              resources: [events]
              verbs: [create, patch]
            - apiGroups: [nats.mikluko.io]
              resources: [natsaccounttrusts, natsconnections, natsoperatortrusts]
              verbs: [get, list, watch]
            - apiGroups: [nats.mikluko.io]
              resources: [natsaccounttrusts/status, natsoperatortrusts/status]
              verbs: [update]
            - apiGroups: [nats.mikluko.io]
              resources: [natsreferencegrants]
              verbs: [list, watch]
  - it: binds its ClusterRole to its ServiceAccount
    documentSelector: {path: kind, value: ClusterRoleBinding}
    asserts:
      - equal:
          path: roleRef
          value: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: rel-auth-controller}
      - equal:
          path: subjects
          value: [{kind: ServiceAccount, name: rel-auth-controller, namespace: nats}]
  - it: grants every verb on Leases, and writing Events, for leader election
    documentSelector: {path: kind, value: Role}
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [get, list, watch, create, update, patch, delete]
            - apiGroups: [""]
              resources: [events]
              verbs: [create, patch]
  - it: runs under its ServiceAccount with leader election on its API group
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: rel-auth-controller
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-election-id=auth.nats.mikluko.io
  - it: tags its image with the chart's appVersion by default
    chart:
      appVersion: 9.8.7
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mikluko/nats-operator/auth-controller:9.8.7
  - it: tags its image with auth.image.tag when set
    set:
      auth.image.tag: v9
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mikluko/nats-operator/auth-controller:v9
  - it: drops the leader election Role and passes --leader-elect=false while leaderElection.enabled is false
    set:
      leaderElection.enabled: false
    asserts:
      - hasDocuments:
          count: 4
      - containsDocument: {kind: Role, apiVersion: rbac.authorization.k8s.io/v1, name: rel-auth-controller-leader-election, namespace: nats, any: true}
        not: true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=false
        documentSelector: {path: kind, value: Deployment}
  - it: passes auth.systemConnection as --system-connection
    set:
      auth.systemConnection: nats/auth-controller
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --system-connection=nats/auth-controller
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 5
  - it: passes no --system-connection while auth.systemConnection is unset
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 4
  - it: sets no annotations, nodeSelector or affinity by default
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notExists: {path: metadata.annotations}
      - notExists: {path: spec.template.metadata.annotations}
      - notExists: {path: spec.template.spec.nodeSelector}
      - notExists: {path: spec.template.spec.affinity}
  - it: puts annotations on the Deployment, auth.annotations over the global ones
    set:
      annotations: {a: global, b: global}
      auth.annotations: {b: auth, c: auth}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: metadata.annotations
          value: {a: global, b: auth, c: auth}
      - notExists: {path: spec.template.metadata.annotations}
  - it: puts podAnnotations on the pod template, auth.podAnnotations over the global ones
    set:
      podAnnotations: {a: global, b: global}
      auth.podAnnotations: {b: auth, c: auth}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value: {a: global, b: auth, c: auth}
      - notExists: {path: metadata.annotations}
  - it: sets nodeSelector, auth.nodeSelector over the global one
    set:
      nodeSelector: {a: global, b: global}
      auth.nodeSelector: {b: auth, c: auth}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {a: global, b: auth, c: auth}
  - it: sets affinity, each key of auth.affinity replacing the global one whole
    set:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{key: pool, operator: In, values: [system]}]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app: global}}
      auth.affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector: {matchLabels: {app: auth}}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions: [{key: pool, operator: In, values: [system]}]
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: topology.kubernetes.io/zone
                    labelSelector: {matchLabels: {app: auth}}
  - it: takes none of another controller's annotations, nodeSelector or affinity
    set:
      jetstream.annotations: {a: jetstream}
      jetstream.podAnnotations: {a: jetstream}
      jetstream.nodeSelector: {a: jetstream}
      jetstream.affinity: {podAntiAffinity: {}}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notExists: {path: metadata.annotations}
      - notExists: {path: spec.template.metadata.annotations}
      - notExists: {path: spec.template.spec.nodeSelector}
      - notExists: {path: spec.template.spec.affinity}
