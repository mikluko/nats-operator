suite: jetstream-controller
templates:
  - templates/jetstream-controller.yaml
release:
  name: rel
  namespace: nats
tests:
  - it: renders the ServiceAccount, RBAC and Deployment with the other two disabled
    set:
      cluster.enabled: false
      auth.enabled: false
    asserts:
      - hasDocuments:
          count: 6
      - containsDocument: {kind: ServiceAccount, apiVersion: v1, name: rel-jetstream-controller, namespace: nats, any: true}
      - containsDocument: {kind: ClusterRole, apiVersion: rbac.authorization.k8s.io/v1, name: rel-jetstream-controller, any: true}
      - containsDocument: {kind: ClusterRoleBinding, apiVersion: rbac.authorization.k8s.io/v1, name: rel-jetstream-controller, any: true}
      - containsDocument: {kind: Role, apiVersion: rbac.authorization.k8s.io/v1, name: rel-jetstream-controller-leader-election, namespace: nats, any: true}
      - containsDocument: {kind: RoleBinding, apiVersion: rbac.authorization.k8s.io/v1, name: rel-jetstream-controller-leader-election, namespace: nats, any: true}
      - containsDocument: {kind: Deployment, apiVersion: apps/v1, name: rel-jetstream-controller, namespace: nats, any: true}
  - it: renders nothing while jetstream.enabled is false
    set:
      jetstream.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: grants exactly its ClusterRole rules
    documentSelector: {path: kind, value: ClusterRole}
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              verbs: [get, list, watch]
            - apiGroups: [events.k8s.io]
              resources: [events]
              verbs: [create, patch]
            - apiGroups: [jetstream.nats.mikluko.io]
              resources: [natsbalancers, natssystembalancers]
              verbs: [get, list, watch]
            - apiGroups: [jetstream.nats.mikluko.io]
              resources: [natsbalancers/status, natsclusterevacuations/status, natsconsumers/status, natskeyvalues/status, natsobjectstores/status, natsstreams/status, natssystembalancers/status]
              verbs: [patch]
            - apiGroups: [jetstream.nats.mikluko.io]
              resources: [natsclusterevacuations, natsconsumers, natskeyvalues, natsobjectstores, natsstreams]
              verbs: [get, list, patch, watch]
            - apiGroups: [nats.mikluko.io]
              resources: [natsconnections]
              verbs: [get, list, watch]
            - apiGroups: [nats.mikluko.io]
              resources: [natsconnections/status]
              verbs: [patch]
            - apiGroups: [nats.mikluko.io]
              resources: [natsreferencegrants]
              verbs: [list, watch]
  - it: binds its ClusterRole to its ServiceAccount
    documentSelector: {path: kind, value: ClusterRoleBinding}
    asserts:
      - equal:
          path: roleRef
          value: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: rel-jetstream-controller}
      - equal:
          path: subjects
          value: [{kind: ServiceAccount, name: rel-jetstream-controller, namespace: nats}]
  - it: grants every verb on Leases, and writing Events, for leader election
    documentSelector: {path: kind, value: Role}
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [get, list, watch, create, update, patch, delete]
            - apiGroups: [""]
              resources: [events]
              verbs: [create, patch]
  - it: runs under its ServiceAccount with leader election on its API group
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: rel-jetstream-controller
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-election-id=jetstream.nats.mikluko.io
  - it: tags its image with the chart's appVersion by default
    chart:
      appVersion: 9.8.7
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mikluko/nats-operator/jetstream-controller:9.8.7
  - it: tags its image with jetstream.image.tag when set
    set:
      jetstream.image.tag: v9
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/mikluko/nats-operator/jetstream-controller:v9
  - it: drops the leader election Role and passes --leader-elect=false while leaderElection.enabled is false
    set:
      leaderElection.enabled: false
    asserts:
      - hasDocuments:
          count: 4
      - containsDocument: {kind: Role, apiVersion: rbac.authorization.k8s.io/v1, name: rel-jetstream-controller-leader-election, namespace: nats, any: true}
        not: true
      - contains:
          path: spec.template.spec.containers[0].args
          content: --leader-elect=false
        documentSelector: {path: kind, value: Deployment}
  - it: passes no --system-connection, even with auth.systemConnection set
    set:
      auth.systemConnection: nats/auth-controller
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].args
          count: 4
  - it: sets no annotations, nodeSelector or affinity by default
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notExists: {path: metadata.annotations}
      - notExists: {path: spec.template.metadata.annotations}
      - notExists: {path: spec.template.spec.nodeSelector}
      - notExists: {path: spec.template.spec.affinity}
  - it: puts annotations on the Deployment, jetstream.annotations over the global ones
    set:
      annotations: {a: global, b: global}
      jetstream.annotations: {b: jetstream, c: jetstream}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: metadata.annotations
          value: {a: global, b: jetstream, c: jetstream}
      - notExists: {path: spec.template.metadata.annotations}
  - it: puts podAnnotations on the pod template, jetstream.podAnnotations over the global ones
    set:
      podAnnotations: {a: global, b: global}
      jetstream.podAnnotations: {b: jetstream, c: jetstream}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.metadata.annotations
          value: {a: global, b: jetstream, c: jetstream}
      - notExists: {path: metadata.annotations}
  - it: sets nodeSelector, jetstream.nodeSelector over the global one
    set:
      nodeSelector: {a: global, b: global}
      jetstream.nodeSelector: {b: jetstream, c: jetstream}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {a: global, b: jetstream, c: jetstream}
  - it: sets affinity, each key of jetstream.affinity replacing the global one whole
    set:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{key: pool, operator: In, values: [system]}]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app: global}}
      jetstream.affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector: {matchLabels: {app: jetstream}}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions: [{key: pool, operator: In, values: [system]}]
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: topology.kubernetes.io/zone
                    labelSelector: {matchLabels: {app: jetstream}}
  - it: takes none of another controller's annotations, nodeSelector or affinity
    set:
      cluster.annotations: {a: cluster}
      cluster.podAnnotations: {a: cluster}
      cluster.nodeSelector: {a: cluster}
      cluster.affinity: {podAntiAffinity: {}}
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - notExists: {path: metadata.annotations}
      - notExists: {path: spec.template.metadata.annotations}
      - notExists: {path: spec.template.spec.nodeSelector}
      - notExists: {path: spec.template.spec.affinity}
