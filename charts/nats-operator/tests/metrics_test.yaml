suite: metrics
templates:
  - templates/metrics.yaml
release:
  name: rel
  namespace: nats
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0
  - it: renders a metrics Service per enabled controller
    set:
      metrics.service.enabled: true
      auth.enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument: {kind: Service, apiVersion: v1, name: rel-cluster-controller-metrics, namespace: nats, any: true}
      - containsDocument: {kind: Service, apiVersion: v1, name: rel-jetstream-controller-metrics, namespace: nats, any: true}
  - it: selects the controller's pods on its metrics port
    set:
      metrics.service.enabled: true
      auth.enabled: false
      jetstream.enabled: false
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: nats-operator
            app.kubernetes.io/instance: rel
            app.kubernetes.io/component: cluster-controller
      - equal:
          path: spec.ports
          value: [{name: metrics, port: 8080, targetPort: metrics}]
  - it: renders a ServiceMonitor beside each Service, scraping HTTPS with the scraper's token and no certificate verification
    set:
      metrics.service.enabled: true
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.labels: {release: prometheus}
      metrics.serviceMonitor.interval: 30s
      cluster.enabled: false
      jetstream.enabled: false
    asserts:
      - hasDocuments:
          count: 2
      - containsDocument: {kind: ServiceMonitor, apiVersion: monitoring.coreos.com/v1, name: rel-auth-controller-metrics, namespace: nats}
        documentIndex: 1
      - equal:
          path: metadata.labels.release
          value: prometheus
        documentIndex: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: nats-operator
            app.kubernetes.io/instance: rel
            app.kubernetes.io/component: auth-controller
        documentIndex: 1
      - equal:
          path: spec.endpoints
          value:
            - port: metrics
              path: /metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig: {insecureSkipVerify: true}
              interval: 30s
        documentIndex: 1
  - it: scrapes the metrics port with the bearer token metrics.serviceMonitor.authorization.credentials names, in place of the Prometheus pod's own
    set:
      metrics.service.enabled: true
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.authorization: {credentials: {name: prometheus-token, key: token}}
      metrics.prometheus.enabled: true
      cluster.enabled: false
      jetstream.enabled: false
    asserts:
      - equal:
          path: spec.endpoints
          value:
            - port: metrics
              path: /metrics
              scheme: https
              authorization: {type: Bearer, credentials: {name: prometheus-token, key: token}}
              tlsConfig: {insecureSkipVerify: true}
            - port: otel-metrics
              path: /metrics
              scheme: http
        documentIndex: 1
  - it: refuses a ServiceMonitor without the Service
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: metrics.serviceMonitor.enabled requires metrics.service.enabled
  - it: adds the OpenTelemetry metrics port to the Service while metrics.prometheus.enabled is set
    set:
      metrics.service.enabled: true
      metrics.prometheus.enabled: true
      auth.enabled: false
      jetstream.enabled: false
    asserts:
      - equal:
          path: spec.ports
          value:
            - {name: metrics, port: 8080, targetPort: metrics}
            - {name: otel-metrics, port: 9464, targetPort: otel-metrics}
  - it: scrapes the OpenTelemetry metrics port over plain HTTP, with no token, beside the metrics port
    set:
      metrics.service.enabled: true
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.interval: 30s
      metrics.prometheus.enabled: true
      cluster.enabled: false
      jetstream.enabled: false
    asserts:
      - equal:
          path: spec.endpoints
          value:
            - port: metrics
              path: /metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig: {insecureSkipVerify: true}
              interval: 30s
            - port: otel-metrics
              path: /metrics
              scheme: http
              interval: 30s
        documentIndex: 1
  - it: refuses metrics.prometheus.enabled without the Service
    set:
      metrics.prometheus.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: metrics.prometheus.enabled requires metrics.service.enabled
  - it: refuses a release name that makes a metrics Service name longer than 63 characters
    release:
      name: a-forty-character-release-name-for-tests
    set:
      metrics.service.enabled: true
      cluster.enabled: false
      auth.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "Service name a-forty-character-release-name-for-tests-jetstream-controller-metrics is 69 characters, over the 63 allowed: the release name can be at most 34 characters"
  - it: renders a metrics Service name of exactly 63 characters
    release:
      name: a-release-name-of-thirty-four-char
    set:
      metrics.service.enabled: true
      cluster.enabled: false
      auth.enabled: false
    asserts:
      - containsDocument: {kind: Service, apiVersion: v1, name: a-release-name-of-thirty-four-char-jetstream-controller-metrics, namespace: nats}
