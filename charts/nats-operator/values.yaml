imagePullSecrets: []

leaderElection:
  enabled: true

# Namespaces every controller watches, passed as --watch-namespaces; set, each
# gets a Role in each of them, and its ClusterRole keeps only the TokenReview
# and SubjectAccessReview its metrics endpoint needs. Empty, every namespace.
watchNamespaces: []

# Every controller's defaults, merged under its own block's, which win.
nodeSelector: {}
# On the Deployment.
annotations: {}
# On the pod template.
podAnnotations: {}
affinity: {}

# Every controller's pod takes these three unless its own block sets them,
# which replaces them whole.
tolerations: []
priorityClassName: ""
topologySpreadConstraints: []

# Appended to every controller's flags, before its own block's extraArgs; of a
# flag given twice, the last wins.
extraArgs: []
# Set in every controller's container; its own block's env replaces an entry
# of the same name.
env: []

cluster:
  enabled: true
  replicas: 1
  # Passes --allow-gateway-without-tls, rendering a NatsCluster gateway
  # without tls; false, such a NatsCluster is refused.
  allowGatewayWithoutTLS: false
  image:
    repository: ghcr.io/mikluko/nats-operator/cluster-controller
    # Defaults to the chart's appVersion.
    tag: ""
    # sha256:<hex>, appended to the tag to pin the image.
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  annotations: {}
  podAnnotations: {}
  affinity: {}
  tolerations: []
  priorityClassName: ""
  topologySpreadConstraints: []
  extraArgs: []
  env: []

auth:
  enabled: true
  replicas: 1
  # namespace/name of a NatsConnection as the system account, passed as
  # --system-connection; empty, no server receives an account JWT.
  systemConnection: ""
  image:
    repository: ghcr.io/mikluko/nats-operator/auth-controller
    # Defaults to the chart's appVersion.
    tag: ""
    # sha256:<hex>, appended to the tag to pin the image.
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  annotations: {}
  podAnnotations: {}
  affinity: {}
  tolerations: []
  priorityClassName: ""
  topologySpreadConstraints: []
  extraArgs: []
  env: []

jetstream:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/mikluko/nats-operator/jetstream-controller
    # Defaults to the chart's appVersion.
    tag: ""
    # sha256:<hex>, appended to the tag to pin the image.
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  annotations: {}
  podAnnotations: {}
  affinity: {}
  tolerations: []
  priorityClassName: ""
  topologySpreadConstraints: []
  extraArgs: []
  env: []

metrics:
  scraper:
    # namespace/name of a ServiceAccount granted `get` on the non-resource URL
    # /metrics, which the controllers' metrics endpoints require of a bearer
    # token. Empty, the chart grants it to no one.
    serviceAccount: ""
  # A Service <release>-<controller>-metrics on each enabled controller's
  # metrics port, which serves HTTPS under a self-signed certificate.
  service:
    enabled: false
  # Each controller's OpenTelemetry metrics, plain HTTP and unauthenticated,
  # on port 9464 (otel-metrics); requires metrics.service.enabled.
  prometheus:
    enabled: false
  # A prometheus-operator ServiceMonitor per enabled controller over that
  # Service, which it requires, scraping with the Prometheus pod's own token,
  # whose ServiceAccount metrics.scraper.serviceAccount must name, and without
  # verifying the certificate.
  serviceMonitor:
    enabled: false
    # On each ServiceMonitor, for a Prometheus that selects them by label.
    labels: {}
    # Empty, Prometheus's own scrape interval.
    interval: ""
    # A Secret key, {name, key}, in the release namespace holding the token
    # the metrics endpoint is scraped with, in place of the Prometheus pod's
    # own; empty, the pod's own.
    bearerTokenSecret: {}

# A NetworkPolicy over each enabled controller's pods admitting ports 8080
# and 9464 from the peers in from alone, and port 8081 from the controller's
# own pods and its `helm test` pod; nothing else inbound.
networkPolicy:
  enabled: false
  # NetworkPolicy peers. Empty, ports 8080 and 9464 admit no one.
  from: []

# The image of the `helm test` pods, which need sh and wget.
tests:
  image:
    repository: busybox
    tag: "1.37.0"
    digest: "sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e"
    pullPolicy: IfNotPresent
