# Each controller is enabled on its own. The CRDs of all four API groups are
# installed whichever are enabled.

imagePullSecrets: []

leaderElection:
  enabled: true

# Namespaces every controller watches and reconciles in, passed as
# --watch-namespaces. Set, each controller gets a Role and RoleBinding in each
# of them instead of a ClusterRole over all, which keeps only the
# cluster-scoped TokenReview and SubjectAccessReview its metrics endpoint
# needs. Empty, the controllers watch every namespace.
watchNamespaces: []

# Every controller's defaults, merged under its own block's, which win.
nodeSelector: {}
# On the Deployment.
annotations: {}
# On the pod template.
podAnnotations: {}
affinity: {}

# Every controller's pod takes these three unless its own block sets them,
# which replaces them whole.
tolerations: []
priorityClassName: ""
topologySpreadConstraints: []

# Appended to every controller's flags, before its own block's extraArgs; of a
# flag given twice, the last wins.
extraArgs: []
# Set in every controller's container; its own block's env replaces an entry
# of the same name.
env: []

cluster:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/mikluko/nats-operator/cluster-controller
    # Defaults to the chart's appVersion.
    tag: ""
    # sha256:<hex>, appended to the tag to pin the image.
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  annotations: {}
  podAnnotations: {}
  affinity: {}
  tolerations: []
  priorityClassName: ""
  topologySpreadConstraints: []
  extraArgs: []
  env: []

auth:
  enabled: true
  replicas: 1
  # namespace/name of a NatsConnection as the system account, passed as
  # --system-connection; empty, no server receives an account JWT.
  systemConnection: ""
  image:
    repository: ghcr.io/mikluko/nats-operator/auth-controller
    # Defaults to the chart's appVersion.
    tag: ""
    # sha256:<hex>, appended to the tag to pin the image.
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  annotations: {}
  podAnnotations: {}
  affinity: {}
  tolerations: []
  priorityClassName: ""
  topologySpreadConstraints: []
  extraArgs: []
  env: []

jetstream:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/mikluko/nats-operator/jetstream-controller
    # Defaults to the chart's appVersion.
    tag: ""
    # sha256:<hex>, appended to the tag to pin the image.
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  annotations: {}
  podAnnotations: {}
  affinity: {}
  tolerations: []
  priorityClassName: ""
  topologySpreadConstraints: []
  extraArgs: []
  env: []

metrics:
  scraper:
    # namespace/name of a ServiceAccount granted `get` on the non-resource URL
    # /metrics, which the controllers' metrics endpoints require of a bearer
    # token. Empty, the chart grants it to no one.
    serviceAccount: ""
  # A Service <release>-<controller>-metrics on each enabled controller's
  # metrics port, which serves HTTPS under a self-signed certificate.
  service:
    enabled: false
  # A prometheus-operator ServiceMonitor per enabled controller over that
  # Service, which it requires. The scrape sends the Prometheus pod's own
  # ServiceAccount token, which metrics.scraper.serviceAccount must name, and
  # skips certificate verification, the certificate being self-signed.
  serviceMonitor:
    enabled: false
    # On each ServiceMonitor, for a Prometheus that selects them by label.
    labels: {}
    # Empty, Prometheus's own scrape interval.
    interval: ""

# The image of the `helm test` pods, which need sh and wget.
tests:
  image:
    repository: busybox
    tag: "1.37.0"
    digest: ""
    pullPolicy: IfNotPresent
