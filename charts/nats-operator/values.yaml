# Each controller is enabled on its own. The CRDs of all four API groups are
# installed whichever are enabled.

imagePullSecrets: []

leaderElection:
  enabled: true

# Every controller's Deployment takes these four, each merged key by key under
# the same value of its own block, whose keys win.
nodeSelector: {}
# On the Deployment.
annotations: {}
# On the pod template.
podAnnotations: {}
affinity: {}

cluster:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/mikluko/nats-operator/cluster-controller
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  annotations: {}
  podAnnotations: {}
  affinity: {}

auth:
  enabled: true
  replicas: 1
  # namespace/name of the NatsConnection passed as --system-connection: a user
  # of a NatsOperator's system account holding the auth-controller preset.
  # Empty, account JWTs are signed but never pushed to the servers.
  systemConnection: ""
  image:
    repository: ghcr.io/mikluko/nats-operator/auth-controller
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  annotations: {}
  podAnnotations: {}
  affinity: {}

jetstream:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/mikluko/nats-operator/jetstream-controller
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  annotations: {}
  podAnnotations: {}
  affinity: {}

metrics:
  scraper:
    # namespace/name of a ServiceAccount granted `get` on the non-resource URL
    # /metrics, which the controllers' metrics endpoints require of a bearer
    # token. Empty, the chart grants it to no one.
    serviceAccount: ""

# The image of the `helm test` pods, which need sh and wget.
tests:
  image:
    repository: busybox
    tag: "1.37.0"
    pullPolicy: IfNotPresent
