---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: natsobjectstores.jetstream.nats.mikluko.io
spec:
  group: jetstream.nats.mikluko.io
  names:
    kind: NatsObjectStore
    listKind: NatsObjectStoreList
    plural: natsobjectstores
    singular: natsobjectstore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Bucket
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: NatsObjectStore is a JetStream object store.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NatsObjectStoreSpec is the desired state of an object store. A field with
              no description is the like-named field of nats.go's
              jetstream.ObjectStoreConfig, documented at https://pkg.go.dev/github.com/nats-io/nats.go/jetstream#ObjectStoreConfig.
            properties:
              adoptionPolicy:
                default: Never
                description: |-
                  AdoptionPolicy is what happens to an object of the same name the
                  controller does not own.
                enum:
                - Never
                - Adopt
                - AdoptOrCreate
                type: string
              compression:
                type: boolean
              connectionRef:
                description: |-
                  ConnectionRef names the NatsConnection whose credentials decide the
                  account.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced object, the referrer's own when omitted.
                      Another namespace is admitted only by a NatsReferenceGrant there.
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy is what deleting the resource does to the object
                  store.
                enum:
                - Retain
                - Delete
                type: string
              description:
                type: string
              maxBytes:
                anyOf:
                - type: integer
                - type: string
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              metadata:
                additionalProperties:
                  type: string
                description: |-
                  Metadata is merged with the ownership marker, which the controller
                  owns.
                type: object
              name:
                description: Name is the bucket, metadata.name when omitted.
                minLength: 1
                type: string
              placement:
                description: Placement is where a stream's replicas are placed.
                properties:
                  cluster:
                    description: Cluster is the NATS cluster the replicas are placed
                      in.
                    type: string
                  preferred:
                    description: Preferred is the server preferred as leader.
                    type: string
                  tags:
                    description: Tags are server tags every replica's server carries.
                    items:
                      type: string
                    type: array
                type: object
              replicas:
                format: int32
                maximum: 5
                minimum: 1
                type: integer
              storage:
                description: Storage is immutable.
                enum:
                - File
                - Memory
                type: string
                x-kubernetes-validations:
                - message: storage is immutable
                  rule: self == oldSelf
              terminalPolicy:
                default: Hold
                description: TerminalPolicy is what a Terminal condition waits for.
                enum:
                - Hold
                - Retry
                type: string
              ttl:
                type: string
            required:
            - connectionRef
            type: object
          status:
            description: NatsObjectStoreStatus is the observed state of an object
              store.
            properties:
              conditions:
                description: 'Conditions: Ready, Synced, Terminal, Adopted.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncedTime:
                description: LastSyncedTime is when the server object was last compared
                  to spec.
                format: date-time
                type: string
              nextCheckTime:
                description: |-
                  NextCheckTime is when a Terminal condition under the Retry policy is
                  next rechecked.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              ownership:
                description: Ownership is the ownership marker on the server object.
                properties:
                  origin:
                    description: Origin is how the object came to be owned.
                    enum:
                    - Created
                    - Adopted
                    type: string
                  uid:
                    description: UID is the owning resource's UID, as written in the
                      object's metadata.
                    type: string
                type: object
              server:
                description: Server is the object store's stream state on the server.
                properties:
                  bytes:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Bytes is the size of the messages stored.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  created:
                    description: Created is when the stream was created on the server.
                    format: date-time
                    type: string
                  leader:
                    description: Leader is the server leading the stream's group.
                    type: string
                  messages:
                    description: Messages is the number of messages stored.
                    format: int64
                    type: integer
                  replicas:
                    description: Replicas are the followers.
                    items:
                      description: ReplicaStatus is one replica of a Raft group.
                      properties:
                        current:
                          description: Current reports whether the replica is current.
                          type: boolean
                        lag:
                          description: Lag is how many operations the replica is behind.
                          format: int64
                          type: integer
                        name:
                          description: Name is the server_name of the server holding
                            the replica.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the bucket name is immutable
          rule: '(has(self.spec.name) ? self.spec.name : self.metadata.name) == (has(oldSelf.spec.name)
            ? oldSelf.spec.name : oldSelf.metadata.name)'
    served: true
    storage: true
    subresources:
      status: {}
