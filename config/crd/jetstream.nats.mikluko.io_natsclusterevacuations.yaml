---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: natsclusterevacuations.jetstream.nats.mikluko.io
spec:
  group: jetstream.nats.mikluko.io
  names:
    kind: NatsClusterEvacuation
    listKind: NatsClusterEvacuationList
    plural: natsclusterevacuations
    singular: natsclusterevacuation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.from.cluster
      name: From
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.moved
      name: Moved
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          NatsClusterEvacuation moves every stream, key-value bucket and object
          store in every account off one NATS cluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NatsClusterEvacuationSpec is the desired state of an evacuation.
            properties:
              connectionRef:
                description: ConnectionRef names a NatsConnection with system credentials.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced object, the referrer's own when omitted.
                      Another namespace is admitted only by a NatsReferenceGrant there.
                    type: string
                required:
                - name
                type: object
              from:
                description: From is the NATS cluster emptied.
                properties:
                  cluster:
                    description: Cluster is the NATS cluster's name.
                    minLength: 1
                    type: string
                required:
                - cluster
                type: object
              to:
                description: To is where the streams are moved.
                properties:
                  serverTags:
                    description: |-
                      ServerTags must match servers of the target only; the evacuation
                      refuses to start if a server of the source carries them.
                    items:
                      type: string
                    minItems: 1
                    type: array
                required:
                - serverTags
                type: object
            required:
            - connectionRef
            - from
            - to
            type: object
          status:
            description: NatsClusterEvacuationStatus is the observed state of an evacuation.
            properties:
              conditions:
                description: 'Conditions: Ready, Progressing.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              inFlight:
                description: InFlight is the number of moves in progress.
                format: int32
                type: integer
              moved:
                description: Moved is the number of streams moved.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              pinned:
                description: |-
                  Pinned are the resources left in place; the evacuation is not Ready
                  while any remains.
                items:
                  description: PinnedObject is a resource whose own spec pins the
                    source cluster.
                  properties:
                    kind:
                      description: Kind is NatsStream, NatsKeyValue or NatsObjectStore.
                      type: string
                    name:
                      description: Name of the resource.
                      type: string
                    namespace:
                      description: Namespace of the resource.
                      type: string
                  required:
                  - kind
                  - name
                  - namespace
                  type: object
                type: array
              remaining:
                description: |-
                  Remaining is the number of streams still to leave the source cluster:
                  in flight, waiting for a slot, or refused by the server in the last
                  pass. Pinned streams and streams left for their owners are not counted.
                format: int32
                type: integer
              requested:
                description: |-
                  Requested are the moves requested that the source cluster has not yet
                  seen complete; deleting the evacuation cancels them.
                items:
                  description: RequestedMove is a stream an evacuation asked the server
                    to move.
                  properties:
                    account:
                      description: Account is the account's public key.
                      type: string
                    stream:
                      description: Stream is the stream's server-side name.
                      type: string
                    time:
                      description: Time the move was last requested.
                      format: date-time
                      type: string
                  required:
                  - account
                  - stream
                  - time
                  type: object
                type: array
              stalePlacement:
                description: |-
                  StalePlacement are the streams moved that no resource owns and whose
                  config still names the source cluster: while it exists, an update that
                  changes their placement returns them to it.
                items:
                  description: ServerStream names a stream on the server.
                  properties:
                    account:
                      description: Account is the account's public key.
                      type: string
                    name:
                      description: Name is the stream's server-side name.
                      type: string
                  required:
                  - account
                  - name
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
