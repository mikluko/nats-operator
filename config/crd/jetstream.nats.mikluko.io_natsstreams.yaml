---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: natsstreams.jetstream.nats.mikluko.io
spec:
  group: jetstream.nats.mikluko.io
  names:
    kind: NatsStream
    listKind: NatsStreamList
    plural: natsstreams
    singular: natsstream
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.name
      name: Stream
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: NatsStream is a JetStream stream.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NatsStreamSpec is the desired state of a stream. The fields of the inlined
              StreamConfig mirror nats.go's jetstream.StreamConfig and mean what their
              like-named fields there mean:
              https://pkg.go.dev/github.com/nats-io/nats.go/jetstream#StreamConfig.
            properties:
              adoptionPolicy:
                default: Never
                description: |-
                  AdoptionPolicy is what happens to an object of the same name the
                  controller does not own.
                enum:
                - Never
                - Adopt
                - AdoptOrCreate
                type: string
              allowAtomicPublish:
                type: boolean
              allowBatchPublish:
                type: boolean
              allowDirect:
                type: boolean
              allowMsgCounter:
                description: AllowMsgCounter is immutable.
                type: boolean
                x-kubernetes-validations:
                - message: allowMsgCounter is immutable
                  rule: self == oldSelf
              allowMsgSchedules:
                description: AllowMsgSchedules cannot be unset.
                type: boolean
                x-kubernetes-validations:
                - message: allowMsgSchedules cannot be unset
                  rule: self || !oldSelf
              allowMsgTTL:
                description: AllowMsgTTL cannot be unset.
                type: boolean
                x-kubernetes-validations:
                - message: allowMsgTTL cannot be unset
                  rule: self || !oldSelf
              allowRollup:
                type: boolean
              compression:
                description: StoreCompression is a stream's storage compression.
                enum:
                - None
                - S2
                type: string
              connectionRef:
                description: |-
                  ConnectionRef names the NatsConnection whose credentials decide the
                  account; it is immutable.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced object, the referrer's own when omitted.
                      Another namespace is admitted only by a NatsReferenceGrant there.
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: connectionRef is immutable
                  rule: self == oldSelf
              consumerLimits:
                description: StreamConsumerLimits are defaults for the stream's consumers.
                properties:
                  inactiveThreshold:
                    type: string
                  maxAckPending:
                    format: int64
                    type: integer
                type: object
              deletionPolicy:
                default: Retain
                description: DeletionPolicy is what deleting the resource does to
                  the stream.
                enum:
                - Retain
                - Delete
                type: string
              denyDelete:
                description: DenyDelete cannot be unset.
                type: boolean
                x-kubernetes-validations:
                - message: denyDelete cannot be unset
                  rule: self || !oldSelf
              denyPurge:
                description: DenyPurge cannot be unset.
                type: boolean
                x-kubernetes-validations:
                - message: denyPurge cannot be unset
                  rule: self || !oldSelf
              description:
                type: string
              discard:
                description: DiscardPolicy is what a full stream discards.
                enum:
                - Old
                - New
                type: string
              discardNewPerSubject:
                type: boolean
              duplicates:
                type: string
              firstSeq:
                format: int64
                minimum: 0
                type: integer
              maxAge:
                type: string
              maxBytes:
                anyOf:
                - type: integer
                - type: string
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              maxConsumers:
                format: int64
                type: integer
              maxMsgSize:
                anyOf:
                - type: integer
                - type: string
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              maxMsgs:
                format: int64
                type: integer
              maxMsgsPerSubject:
                format: int64
                type: integer
              metadata:
                additionalProperties:
                  type: string
                description: |-
                  Metadata is merged with the ownership marker, which the controller
                  owns.
                type: object
              mirror:
                description: |-
                  Mirror cannot change once set; omitting it leaves the server's mirror
                  in place.
                properties:
                  consumer:
                    description: Consumer is a durable consumer on the origin used
                      for sourcing.
                    properties:
                      deliverSubject:
                        description: DeliverSubject is the server's deliver_subject.
                        type: string
                      name:
                        description: Name is the server's consumer name.
                        type: string
                    type: object
                  external:
                    description: External qualifies an origin in another account or
                      domain.
                    properties:
                      apiPrefix:
                        description: APIPrefix is the JetStream API prefix.
                        type: string
                      deliverPrefix:
                        description: DeliverPrefix is the deliver subject prefix.
                        type: string
                    required:
                    - apiPrefix
                    type: object
                  filterSubject:
                    description: FilterSubject filters the origin's messages.
                    type: string
                  name:
                    description: Name is the origin stream's server-side name.
                    minLength: 1
                    type: string
                  optStartSeq:
                    description: OptStartSeq is the origin sequence to start at.
                    format: int64
                    type: integer
                  optStartTime:
                    description: OptStartTime is the origin time to start at.
                    format: date-time
                    type: string
                  subjectTransforms:
                    description: SubjectTransforms filter and transform the origin's
                      subjects.
                    items:
                      description: SubjectTransform maps a source subject to a destination
                        subject.
                      properties:
                        destination:
                          description: Destination is the server's dest, the subject
                            they become.
                          type: string
                        source:
                          description: Source is the server's src, the subjects transformed.
                          type: string
                      required:
                      - destination
                      type: object
                    type: array
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: mirror cannot change
                  rule: self == oldSelf
              mirrorDirect:
                type: boolean
              name:
                description: Name is the server-side stream name, metadata.name when
                  omitted.
                minLength: 1
                type: string
              noAck:
                type: boolean
              persistMode:
                description: PersistMode is immutable.
                enum:
                - Default
                - Async
                type: string
                x-kubernetes-validations:
                - message: persistMode is immutable
                  rule: self == oldSelf
              placement:
                description: Placement pins the stream; a changed cluster moves it.
                properties:
                  cluster:
                    description: Cluster is the NATS cluster the replicas are placed
                      in.
                    type: string
                  preferred:
                    description: Preferred is the server preferred as leader.
                    type: string
                  tags:
                    description: Tags are server tags every replica's server carries.
                    items:
                      type: string
                    type: array
                type: object
              replicas:
                format: int32
                maximum: 5
                minimum: 1
                type: integer
              republish:
                description: Republish republishes stored messages.
                properties:
                  destination:
                    description: |-
                      Destination is the server's dest, the subject they are republished
                      to.
                    type: string
                  headersOnly:
                    description: HeadersOnly republishes headers without the payload.
                    type: boolean
                  source:
                    description: Source is the server's src, the stored subjects republished.
                    type: string
                required:
                - destination
                type: object
              retention:
                description: Retention cannot change to or from WorkQueue.
                enum:
                - Limits
                - Interest
                - WorkQueue
                type: string
                x-kubernetes-validations:
                - message: retention cannot change to or from WorkQueue
                  rule: (self == 'WorkQueue') == (oldSelf == 'WorkQueue')
              sealed:
                description: Sealed cannot be unset.
                type: boolean
                x-kubernetes-validations:
                - message: sealed cannot be unset
                  rule: self || !oldSelf
              sources:
                items:
                  description: StreamSource is a stream a mirror or source copies
                    from.
                  properties:
                    consumer:
                      description: Consumer is a durable consumer on the origin used
                        for sourcing.
                      properties:
                        deliverSubject:
                          description: DeliverSubject is the server's deliver_subject.
                          type: string
                        name:
                          description: Name is the server's consumer name.
                          type: string
                      type: object
                    external:
                      description: External qualifies an origin in another account
                        or domain.
                      properties:
                        apiPrefix:
                          description: APIPrefix is the JetStream API prefix.
                          type: string
                        deliverPrefix:
                          description: DeliverPrefix is the deliver subject prefix.
                          type: string
                      required:
                      - apiPrefix
                      type: object
                    filterSubject:
                      description: FilterSubject filters the origin's messages.
                      type: string
                    name:
                      description: Name is the origin stream's server-side name.
                      minLength: 1
                      type: string
                    optStartSeq:
                      description: OptStartSeq is the origin sequence to start at.
                      format: int64
                      type: integer
                    optStartTime:
                      description: OptStartTime is the origin time to start at.
                      format: date-time
                      type: string
                    subjectTransforms:
                      description: SubjectTransforms filter and transform the origin's
                        subjects.
                      items:
                        description: SubjectTransform maps a source subject to a destination
                          subject.
                        properties:
                          destination:
                            description: Destination is the server's dest, the subject
                              they become.
                            type: string
                          source:
                            description: Source is the server's src, the subjects
                              transformed.
                            type: string
                        required:
                        - destination
                        type: object
                      type: array
                  required:
                  - name
                  type: object
                type: array
              storage:
                description: Storage is immutable.
                enum:
                - File
                - Memory
                type: string
                x-kubernetes-validations:
                - message: storage is immutable
                  rule: self == oldSelf
              subjectDeleteMarkerTTL:
                type: string
              subjectTransform:
                description: SubjectTransform maps a source subject to a destination
                  subject.
                properties:
                  destination:
                    description: Destination is the server's dest, the subject they
                      become.
                    type: string
                  source:
                    description: Source is the server's src, the subjects transformed.
                    type: string
                required:
                - destination
                type: object
              subjects:
                items:
                  type: string
                type: array
              terminalPolicy:
                default: Hold
                description: TerminalPolicy is what a Terminal condition waits for.
                enum:
                - Hold
                - Retry
                type: string
            required:
            - connectionRef
            type: object
          status:
            description: NatsStreamStatus is the observed state of a stream.
            properties:
              conditions:
                description: 'Conditions: Ready, Synced, Terminal, Adopted.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncedTime:
                description: LastSyncedTime is when the server object was last compared
                  to spec.
                format: date-time
                type: string
              nextCheckTime:
                description: |-
                  NextCheckTime is when a Terminal condition under the Retry policy is
                  next rechecked.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              ownership:
                description: Ownership is the ownership marker on the server object.
                properties:
                  origin:
                    description: Origin is how the object came to be owned.
                    enum:
                    - Created
                    - Adopted
                    type: string
                  uid:
                    description: UID is the owning resource's UID, as written in the
                      object's metadata.
                    type: string
                type: object
              server:
                description: Server is the stream's state on the server.
                properties:
                  bytes:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Bytes is the size of the messages stored.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  created:
                    description: Created is when the stream was created on the server.
                    format: date-time
                    type: string
                  leader:
                    description: Leader is the server leading the stream's group.
                    type: string
                  messages:
                    description: Messages is the number of messages stored.
                    format: int64
                    type: integer
                  replicas:
                    description: Replicas are the followers.
                    items:
                      description: ReplicaStatus is one replica of a Raft group.
                      properties:
                        current:
                          description: Current reports whether the replica is current.
                          type: boolean
                        lag:
                          description: Lag is how many operations the replica is behind.
                          format: int64
                          type: integer
                        name:
                          description: Name is the server_name of the server holding
                            the replica.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                type: object
              transfer:
                description: Transfer is a move to another NATS cluster in progress.
                properties:
                  consumers:
                    description: Consumers is how many of the stream's consumers have
                      moved.
                    properties:
                      moved:
                        description: |-
                          Moved counts the stream's consumers led from the target NATS cluster
                          with no move left in flight.
                        format: int32
                        type: integer
                      total:
                        description: Total counts every consumer of the stream.
                        format: int32
                        type: integer
                    type: object
                  from:
                    description: From is the NATS cluster the stream leaves.
                    type: string
                  replicas:
                    description: Replicas are the new replicas.
                    items:
                      description: ReplicaStatus is one replica of a Raft group.
                      properties:
                        current:
                          description: Current reports whether the replica is current.
                          type: boolean
                        lag:
                          description: Lag is how many operations the replica is behind.
                          format: int64
                          type: integer
                        name:
                          description: Name is the server_name of the server holding
                            the replica.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  started:
                    description: Started is when the move began.
                    format: date-time
                    type: string
                  to:
                    description: To is the NATS cluster the stream moves to.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the stream name is immutable
          rule: '(has(self.spec.name) ? self.spec.name : self.metadata.name) == (has(oldSelf.spec.name)
            ? oldSelf.spec.name : oldSelf.metadata.name)'
    served: true
    storage: true
    subresources:
      status: {}
