name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUGO_VERSION: 0.166.0

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v3
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.3
      - name: Install Hugo
        run: |
          curl -fsSLo "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - run: just verify
      - run: just chart
      - run: just build
      - run: just test
      - run: just envtest
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  chart-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - uses: helm/chart-testing-action@v2.8.0
      - run: ct lint --charts charts/nats-operator --check-version-increment=false

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mikluko/action-changelog@v1
