name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: 1.58.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - name: Install helm-unittest
        env:
          HELM_UNITTEST_VERSION: v1.0.3
          HELM_UNITTEST_SHA256: 9761f23d9509c98770c026e019e743b524b57010f4bc29175f78d2582ace0633
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm-unittest.tgz" \
            "https://github.com/helm-unittest/helm-unittest/releases/download/${HELM_UNITTEST_VERSION}/helm-unittest-linux-amd64-${HELM_UNITTEST_VERSION#v}.tgz"
          echo "$HELM_UNITTEST_SHA256  $RUNNER_TEMP/helm-unittest.tgz" | sha256sum -c --quiet
          plugin="$(helm env HELM_PLUGINS)/helm-unittest"
          mkdir -p "$plugin"
          tar -xzf "$RUNNER_TEMP/helm-unittest.tgz" -C "$plugin"
          helm unittest --help >/dev/null
      - uses: ./.github/actions/setup-hugo
      - run: just verify
      - run: just chart
      - run: just build
      - run: just test
      - run: just envtest
      - run: just lint

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npx --yes --package renovate@44.117.2 -- renovate-config-validator --strict --no-global .github/renovate.json

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true

  e2e:
    strategy:
      fail-fast: false
      matrix:
        watch-namespaces: [false, true]
    uses: ./.github/workflows/e2e.yml
    with:
      stories: "1"
      watch-namespaces: ${{ matrix.watch-namespaces }}

  chart-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: 3.14.0
      - run: ct lint --charts charts/nats-operator --check-version-increment=false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9
        with:
          version: v0.19.1
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      - name: Load the controller images into kind
        env:
          KO_DOCKER_REPO: kind.local
          KIND_CLUSTER_NAME: chart-testing
          VERSION: ci
        run: ko build --base-import-paths --tags ci ./cmd/*-controller
      - name: Create the namespaces ci/namespaced-values.yaml watches
        run: |
          for ns in $(yq '.watchNamespaces[]' charts/nats-operator/ci/namespaced-values.yaml); do
            kubectl create namespace "$ns"
          done
      - run: |
          set=
          for c in cluster auth jetstream; do
            set="$set --set=$c.image.repository=kind.local/$c-controller --set=$c.image.tag=ci"
          done
          ct install --charts charts/nats-operator --helm-extra-set-args "$set" \
            --namespace "$(yq '.watchNamespaces[0]' charts/nats-operator/ci/namespaced-values.yaml)"

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: mikluko/action-changelog@6dc550835d89afd4e826611ec06b9e054a362cb0 # v1.3.1
