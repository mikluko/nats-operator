name: Cut release
run-name: "Checking main and cutting a release if one is due: ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  cut:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_CERT }}
          permission-contents: write
      # A tag pushed with GITHUB_TOKEN triggers no workflow, so the checkout keeps the app's token for the push.
      - uses: actions/checkout@v7
        with: # zizmor: ignore[artipacked] the Cut step pushes with this token, and the job uploads no artifact
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - id: changelog
        uses: mikluko/action-changelog@v1
      - name: Cut
        if: steps.changelog.outputs.due == 'true'
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "refs/tags/v$VERSION"
          echo "Cut **v$VERSION**." >>"$GITHUB_STEP_SUMMARY"
