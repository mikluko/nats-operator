name: Roll release
run-name: ${{ github.event_name == 'push' && format('Releasing {0}', github.ref_name) || format('Dry run of a release from {0}', github.ref_name) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-roll
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/mikluko/nats-operator
  CHART_REPOSITORY: oci://ghcr.io/mikluko/nats-operator/charts

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.version.outputs.due }}
      reason: ${{ steps.version.outputs.reason }}
      version: ${{ steps.version.outputs.version }}
      tag: v${{ steps.version.outputs.version }}
      prerelease: ${{ steps.changelog.outputs.prerelease }}
      notes: ${{ steps.changelog.outputs.notes }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changelog
        uses: mikluko/action-changelog@v1
        with:
          due-prerelease: true
      - id: version
        name: Version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          NEWEST: ${{ steps.changelog.outputs.version }}
          DUE: ${{ steps.changelog.outputs.due }}
          DUE_REASON: ${{ steps.changelog.outputs['due-reason'] }}
        run: |
          due=$DUE
          reason=$DUE_REASON
          version=$NEWEST
          publish=false
          if [ "$EVENT" = push ]; then
            version=${REF_NAME#v}
            if [ -z "$NEWEST" ] || [ "$REF_NAME" != "v$NEWEST" ]; then
              echo "::error::tag $REF_NAME is not the newest version CHANGELOG.md names, ${NEWEST:-which is none}"
              exit 1
            fi
            due=true
            publish=true
            reason="$REF_NAME is the newest version CHANGELOG.md names"
          fi
          echo "::notice::${reason:-$version is due}"
          {
            echo "due=$due"
            echo "reason=$reason"
            echo "version=$version"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"

  images:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Log in
        if: needs.plan.outputs.publish == 'true'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}
          VERSION: ${{ needs.plan.outputs.version }}
          PUSH: ${{ needs.plan.outputs.publish == 'true' }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set --
          for c in cmd/*-controller; do
            set -- "$@" "./$c"
          done
          ko build --base-import-paths --push="$PUSH" \
            --platform linux/amd64,linux/arm64 --tags "$VERSION" \
            --image-label "org.opencontainers.image.source=$SOURCE" \
            --image-label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --image-label "org.opencontainers.image.version=$VERSION" \
            "$@" >"$RUNNER_TEMP/images"
      - id: digests
        name: Digests
        run: |
          digests='[]'
          while read -r ref; do
            name=${ref%@*}
            digest=${ref#*@}
            digests=$(jq -c --arg name "${name%:*}" --arg digest "$digest" \
              '. + [{name: $name, digest: $digest}]' <<<"$digests")
          done <"$RUNNER_TEMP/images"
          echo "digests=$digests" >>"$GITHUB_OUTPUT"
      - name: Sign
        if: needs.plan.outputs.publish == 'true'
        env:
          DIGESTS: ${{ steps.digests.outputs.digests }}
        run: |
          jq -r '.[] | "\(.name)@\(.digest)"' <<<"$DIGESTS" | while read -r ref; do
            cosign sign --yes "$ref"
          done

  provenance:
    needs: [plan, images]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        subject: ${{ fromJSON(needs.images.outputs.digests) }}
    steps:
      - name: Log in
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ matrix.subject.name }}
          subject-digest: ${{ matrix.subject.digest }}
          push-to-registry: true

  chart:
    needs: [plan, images]
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: pin
        name: Pin digests
        env:
          DIGESTS: ${{ needs.images.outputs.digests }}
        run: go run ./hack/pindigests -registry "$REGISTRY" charts/nats-operator/values.yaml <<<"$DIGESTS"
      - name: Package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          helm package charts/nats-operator \
            --version "$VERSION" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP/chart"
      - id: push
        name: Push and sign
        if: needs.plan.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/nats-operator-$VERSION.tgz" "$CHART_REPOSITORY" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest=$(awk '$1 == "Digest:" { print $2 }' "$RUNNER_TEMP/push.log")
          test -n "$digest"
          name=${CHART_REPOSITORY#oci://}/nats-operator
          cosign sign --yes "$name@$digest"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Last, so a release exists only once every artifact it names does.
  release:
    needs: [plan, images, provenance, chart]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
          echo "release $TAG from $GITHUB_SHA:"
          cat "$RUNNER_TEMP/notes.md"
      - name: Release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=
          if [ "$PRERELEASE" = true ]; then flags=--prerelease; fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" $flags
