name: End-to-end stories
run-name: "${{ github.event_name == 'schedule' && (github.event.schedule == '47 5 * * 0' && 'Running every story on three Kubernetes clusters, weekly' || 'Running every story on two Kubernetes clusters, nightly') || format('Running {0} on {1} from {2}', inputs.stories && format('stories {0}', inputs.stories) || 'every story', inputs.clusters == '1' && 'one Kubernetes cluster' || format('{0} Kubernetes clusters', inputs.clusters), github.ref_name) }}"

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "47 5 * * 0"
  workflow_dispatch:
    inputs:
      stories:
        description: Comma-separated story numbers; empty runs every story.
        type: string
        default: ""
      watch-namespaces:
        description: Install the chart scoped to the stories' namespaces.
        type: boolean
        default: false
      clusters:
        description: Kubernetes clusters; a story spanning more skips.
        type: choice
        options: ["1", "2", "3"]
        default: "1"
  workflow_call:
    inputs:
      stories:
        description: Comma-separated story numbers.
        type: string
        required: true
      watch-namespaces:
        description: Install the chart scoped to the stories' namespaces.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - name: Rootful podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          sudo systemctl enable --now podman.socket
          sudo test -S /run/podman/podman.sock
      - name: Stories
        env:
          E2E_CLUSTERS: ${{ github.event_name == 'schedule' && (github.event.schedule == '47 5 * * 0' && '3' || '2') || inputs.clusters || '1' }}
          E2E_STORIES: ${{ inputs.stories }}
          E2E_WATCH_NAMESPACES: ${{ inputs.watch-namespaces }}
        run: sudo --preserve-env=E2E_CLUSTERS,E2E_STORIES,E2E_WATCH_NAMESPACES,HOME,GOPATH,GOMODCACHE,GOCACHE env "PATH=$PATH" just e2e
