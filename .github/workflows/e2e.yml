name: e2e

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "47 5 * * 0"
  workflow_dispatch:
    inputs:
      stories:
        description: Comma-separated story numbers; empty runs every story.
        type: string
        default: ""
      watch-namespaces:
        description: Install the chart scoped to the stories' namespaces.
        type: boolean
        default: false
      clusters:
        description: Kubernetes clusters; a story spanning more skips.
        type: choice
        options: ["1", "2", "3"]
        default: "1"
  workflow_call:
    inputs:
      stories:
        description: Comma-separated story numbers.
        type: string
        required: true
      watch-namespaces:
        description: Install the chart scoped to the stories' namespaces.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: 1.58.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9
        with:
          version: v0.19.1
      - name: Rootful podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          sudo systemctl enable --now podman.socket
          sudo test -S /run/podman/podman.sock
      - name: Stories
        env:
          E2E_CLUSTERS: ${{ github.event_name == 'schedule' && (github.event.schedule == '47 5 * * 0' && '3' || '2') || inputs.clusters || '1' }}
          E2E_STORIES: ${{ inputs.stories }}
          E2E_WATCH_NAMESPACES: ${{ inputs.watch-namespaces }}
        run: sudo --preserve-env=E2E_CLUSTERS,E2E_STORIES,E2E_WATCH_NAMESPACES,HOME,GOPATH,GOMODCACHE,GOCACHE env "PATH=$PATH" just e2e
