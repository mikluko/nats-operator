name: release

# One workflow: a tag pushed with GITHUB_TOKEN triggers no other.
on: # zizmor: ignore[dangerous-triggers] plan runs only after a push to main in this repository
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/mikluko/nats-operator
  # A workflow_run event runs at main's tip, possibly past the commit ci passed.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  CHART_REPOSITORY: oci://ghcr.io/mikluko/nats-operator/charts

jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.changelog.outputs.version != '' && steps.changelog.outputs['already-tagged'] == 'false' }}
      version: ${{ steps.changelog.outputs.version }}
      tag: v${{ steps.changelog.outputs.version }}
      prerelease: ${{ steps.changelog.outputs.prerelease }}
      notes: ${{ steps.changelog.outputs.notes }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - id: changelog
        uses: mikluko/action-changelog@6dc550835d89afd4e826611ec06b9e054a362cb0 # v1.3.1
      - id: publish
        env:
          PUBLISH: ${{ github.event_name == 'workflow_run' }}
        run: echo "publish=$PUBLISH" >>"$GITHUB_OUTPUT"

  images:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.SHA }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9
        with:
          version: v0.19.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in
        if: needs.plan.outputs.publish == 'true'
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Build
        env:
          KO_DOCKER_REPO: ${{ env.REGISTRY }}
          VERSION: ${{ needs.plan.outputs.version }}
          PUSH: ${{ needs.plan.outputs.publish == 'true' }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set --
          for c in cmd/*-controller; do
            set -- "$@" "./$c"
          done
          ko build --base-import-paths --push="$PUSH" \
            --platform linux/amd64,linux/arm64 --tags "$VERSION" \
            --image-label "org.opencontainers.image.source=$SOURCE" \
            --image-label "org.opencontainers.image.revision=$SHA" \
            --image-label "org.opencontainers.image.version=$VERSION" \
            "$@" >"$RUNNER_TEMP/images"
      - id: digests
        name: Digests
        run: |
          digests='[]'
          while read -r ref; do
            name=${ref%@*}
            digest=${ref#*@}
            digests=$(jq -c --arg name "${name%:*}" --arg digest "$digest" \
              '. + [{name: $name, digest: $digest}]' <<<"$digests")
          done <"$RUNNER_TEMP/images"
          echo "digests=$digests" >>"$GITHUB_OUTPUT"
      - name: Sign
        if: needs.plan.outputs.publish == 'true'
        env:
          DIGESTS: ${{ steps.digests.outputs.digests }}
        run: |
          jq -r '.[] | "\(.name)@\(.digest)"' <<<"$DIGESTS" | while read -r ref; do
            cosign sign --yes "$ref"
          done

  provenance:
    needs: [plan, images]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        subject: ${{ fromJSON(needs.images.outputs.digests) }}
    steps:
      - name: Log in
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.subject.name }}
          subject-digest: ${{ matrix.subject.digest }}
          push-to-registry: true

  chart:
    needs: [plan, images]
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ env.SHA }}
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - id: pin
        name: Pin digests
        env:
          DIGESTS: ${{ needs.images.outputs.digests }}
        run: go run ./hack/pindigests -registry "$REGISTRY" charts/nats-operator/values.yaml <<<"$DIGESTS"
      - name: Package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          helm package charts/nats-operator \
            --version "$VERSION" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP/chart"
      - id: push
        name: Push and sign
        if: needs.plan.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/nats-operator-$VERSION.tgz" "$CHART_REPOSITORY" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest=$(awk '$1 == "Digest:" { print $2 }' "$RUNNER_TEMP/push.log")
          test -n "$digest"
          name=${CHART_REPOSITORY#oci://}/nats-operator
          cosign sign --yes "$name@$digest"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Last, so a tag and a release exist only once every artifact they name does.
  release:
    needs: [plan, images, provenance, chart]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
          echo "release $TAG from $SHA:"
          cat "$RUNNER_TEMP/notes.md"
      - name: Tag and release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=
          if [ "$PRERELEASE" = true ]; then flags=--prerelease; fi
          gh release create "$TAG" --title "$TAG" --target "$SHA" \
            --notes-file "$RUNNER_TEMP/notes.md" $flags

  docs:
    needs: [plan, release]
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
