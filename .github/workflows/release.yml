name: release

# The changelog decides the version: a push to main whose newest CHANGELOG.md
# entry names a version no tag carries publishes it, and nothing else does.
# One workflow, because a tag pushed with GITHUB_TOKEN triggers no other.
#
# A manual run builds and packages everything and publishes nothing unless
# dry-run is switched off on main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and package without pushing, tagging or releasing.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/mikluko/nats-operator
  CHART_REPOSITORY: oci://ghcr.io/mikluko/nats-operator/charts

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.plan.outputs.due }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      notes: ${{ steps.changelog.outputs.notes }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changelog
        uses: mikluko/action-changelog@v1
      - id: plan
        env:
          VALID: ${{ steps.changelog.outputs.valid }}
          VERSION: ${{ steps.changelog.outputs.version }}
          TAGGED: ${{ steps.changelog.outputs.already-tagged }}
          PRERELEASE: ${{ steps.changelog.outputs.prerelease }}
        run: hack/release-plan.sh
      - id: publish
        env:
          PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || !inputs.dry-run) }}
        run: echo "publish=$PUBLISH" >>"$GITHUB_OUTPUT"

  images:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        controller: [cluster-controller, auth-controller, jetstream-controller]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: CONTROLLER=${{ matrix.controller }}
          push: ${{ needs.plan.outputs.publish == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ matrix.controller }}:${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}

  chart:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          helm package charts/nats-operator \
            --version "$VERSION" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP/chart"
      - name: Push
        if: needs.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/nats-operator-$VERSION.tgz" "$CHART_REPOSITORY"

  # Last, so a tag and a release exist only once every artifact they name does.
  release:
    needs: [plan, images, chart]
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
          echo "release $TAG from $GITHUB_SHA:"
          cat "$RUNNER_TEMP/notes.md"
      - name: Tag and release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          flags=
          if [ "$PRERELEASE" = true ]; then flags=--prerelease; fi
          gh release create "$TAG" --title "$TAG" --verify-tag \
            --notes-file "$RUNNER_TEMP/notes.md" $flags
