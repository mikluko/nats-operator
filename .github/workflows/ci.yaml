name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'hack/tools/go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.sum', 'hack/tools/go.sum') }}-
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - uses: ./.github/actions/setup-hugo
      - run: just verify
      - run: just build
      - run: just test
      - run: just lint
      - if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  race:
    name: go race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum', 'hack/tools/go.sum') }}-${{ github.sha }}
          restore-keys: go-race-${{ runner.os }}-${{ hashFiles('go.sum', 'hack/tools/go.sum') }}-
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - uses: ./.github/actions/setup-hugo
      - run: just test -race
      - if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  envtest:
    name: go envtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-envtest-${{ runner.os }}-${{ hashFiles('go.sum', 'hack/tools/go.sum') }}-${{ github.sha }}
          restore-keys: go-envtest-${{ runner.os }}-${{ hashFiles('go.sum', 'hack/tools/go.sum') }}-
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - run: just envtest
      - if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes --package renovate@44.117.2 -- renovate-config-validator --strict --no-global .github/renovate.json

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.6.4
        with:
          version: 1.30.1
          config: .github/zizmor.yaml
          advanced-security: false
          annotations: true

  e2e:
    strategy:
      fail-fast: false
      matrix:
        watch-namespaces: [false, true]
    uses: ./.github/workflows/e2e.yaml
    with:
      stories: "1"
      watch-namespaces: ${{ matrix.watch-namespaces }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - name: Install helm-unittest
        env:
          HELM_UNITTEST_VERSION: v1.1.2
          HELM_UNITTEST_SHA256: de03d6b7ba7683282064702d0b36fbbe812ab2a22691fa3a8b2ce57c2682609c
        run: |
          curl -fsSLo "$RUNNER_TEMP/helm-unittest.tgz" \
            "https://github.com/helm-unittest/helm-unittest/releases/download/${HELM_UNITTEST_VERSION}/helm-unittest-linux-amd64-${HELM_UNITTEST_VERSION#v}.tgz"
          echo "$HELM_UNITTEST_SHA256  $RUNNER_TEMP/helm-unittest.tgz" | sha256sum -c --quiet
          plugin="$(helm env HELM_PLUGINS)/helm-unittest"
          mkdir -p "$plugin"
          tar -xzf "$RUNNER_TEMP/helm-unittest.tgz" -C "$plugin"
          helm unittest --help >/dev/null
      - run: just chart
      - uses: helm/chart-testing-action@v2
        with:
          version: 3.14.0
      - run: ct lint --charts charts/nats-operator --check-version-increment=false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - uses: ko-build/setup-ko@v0.10
        with:
          version: v0.19.1
      - uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      - name: Load the controller images into kind
        env:
          KO_DOCKER_REPO: kind.local
          KIND_CLUSTER_NAME: chart-testing
          VERSION: ci
        run: ko build --base-import-paths --tags ci ./cmd/*-controller
      - name: Create the namespaces ci/namespaced-values.yaml watches
        run: |
          for ns in $(yq '.watchNamespaces[]' charts/nats-operator/ci/namespaced-values.yaml); do
            kubectl create namespace "$ns"
          done
      - run: |
          set=
          for c in cluster auth jetstream; do
            set="$set --set=$c.image.repository=kind.local/$c-controller --set=$c.image.tag=ci"
          done
          ct install --charts charts/nats-operator --helm-extra-set-args "$set" \
            --namespace "$(yq '.watchNamespaces[0]' charts/nats-operator/ci/namespaced-values.yaml)"

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: mikluko/action-changelog@v1
