name: setup-hugo
description: Installs the Hugo extended release the documentation site is built with.
runs:
  using: composite
  steps:
    - name: Install Hugo
      shell: bash
      env:
        HUGO_VERSION: 0.166.0
        HUGO_SHA256: 52b06555f739b1a08e04f5c31296e9bdf166a012e9b7e3137befc889dbc24db8
      run: |
        curl -fsSLo "$RUNNER_TEMP/hugo.deb" \
          "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
        echo "$HUGO_SHA256  $RUNNER_TEMP/hugo.deb" | sha256sum -c --quiet
        sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
