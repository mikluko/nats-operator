status:
  observedGeneration: 1
  conditions:
    - type: Ready
      status: "True"
      reason: Balancing
    - type: Holding
      status: "True"
      reason: YieldingToSystemBalancer
      message: REQ_07 has a placement move pending from NatsSystemBalancer demo
    - type: Overlapping
      status: "True"
      reason: StreamsInSeveralPools
      message: REQ_12 matches requests and responses; balanced in requests
  pools:
    - name: requests
      streams: 12
      leaderSkew: !any 2
    - name: responses
      streams: 12
      leaderSkew: !any 0
    - name: (default)
      streams: 3
      leaderSkew: !any 1
