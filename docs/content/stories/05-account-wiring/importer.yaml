# The core account consumes both. An import names the export, not a subject:
# the subject, type and response type come from the exporting account, so the
# two sides cannot disagree.
apiVersion: auth.nats.mikluko.io/v1beta1
kind: NatsAccount
metadata:
  name: core
  namespace: nats-system
spec:
  operatorRef:
    name: demo
  imports:
    - accountRef:
        kind: NatsAccount
        name: monitoring   # cross-namespace needs a NatsReferenceGrant, as for users
      export: check-results
      # Where it appears in this account; defaults to the exported subject.
      localSubject: "upstream.results.>"
    - accountRef:
        kind: NatsAccount
        name: monitoring
      export: execute
