# Story 2: the platform engineer wants the NATS cluster from story 1 to run
# under a NATS operator the auth controller owns, with accounts and users
# declared as resources instead of minted by hand.
apiVersion: auth.nats.mikluko.io/v1alpha1
kind: NatsOperator
metadata:
  name: demo
  namespace: nats-system
spec:
  # No `keys`: the auth controller generates the identity key and one signing
  # key and keeps each seed in a Secret it owns. `keys.identity` and
  # `keys.signing[]` adopt existing seeds instead, and `jwt` with signing keys
  # only keeps the identity offline (spec section 5.1). Account JWTs are
  # signed with a signing key, never the identity key.

  # The one system account the operator JWT names; NATS allows exactly one.
  # Other NatsSystemAccounts may exist unreferenced: they are not signed and
  # their users get no creds. Flipping this ref is how a system account is
  # rotated, and `system_account` is restart-only (nats-server 2.15.0
  # reload.go:1969), so every server in the supercluster restarts.
  systemAccountRef:
    name: sys
