# Story 1's NatsCluster, now under the NATS operator. Only `auth` is new.
apiVersion: cluster.nats.mikluko.io/v1beta1
kind: NatsCluster
metadata:
  name: demo
  namespace: nats-system
spec:
  version: 2.15.0
  replicas: 3
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      memory: 4Gi
  jetstream:
    volumeClaimTemplate:
      spec:
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi
  auth:
    # Every NatsCluster reaches its trust roots this way, standalone,
    # supercluster member or leaf. From them the cluster controller renders
    # `operator`, `system_account` and the resolver with the system account
    # preloaded.
    trustRef:
      name: demo
    # What the cluster controller connects as for reloads and settledness.
    # A Secret, not a NatsUser reference, so the same field works in a
    # Kubernetes cluster with no auth controller (story 6).
    systemCredentials:
      secretKeyRef:
        name: cluster-controller-creds   # key defaults to user.creds
