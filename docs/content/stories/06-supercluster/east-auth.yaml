# Declared in the home cluster for the remote one: the west controllers'
# system users (Q2075). Scoped by preset, never expiring, removed by
# revocation. Their Secrets are written here and carried to west.
apiVersion: auth.nats.mikluko.io/v1beta1
kind: NatsUser
metadata:
  name: west-cluster-controller
  namespace: nats-system
spec:
  accountRef:
    kind: NatsSystemAccount
    name: sys
  preset: cluster-controller
  credentials:
    secretKeyRef:
      name: west-cluster-controller-creds
---
apiVersion: auth.nats.mikluko.io/v1beta1
kind: NatsUser
metadata:
  name: west-jetstream-controller
  namespace: nats-system
spec:
  accountRef:
    kind: NatsSystemAccount
    name: sys
  preset: jetstream-controller
  credentials:
    secretKeyRef:
      name: west-jetstream-controller-creds
