# The new cluster, prod-east-2, is already a member beside prod-east, with a
# placement tag no other server carries.
apiVersion: cluster.nats.mikluko.io/v1alpha1
kind: NatsCluster
metadata:
  name: prod-east-2
  namespace: nats-system
spec:
  version: 2.15.1
  replicas: 5
  serverTags:
    cluster: prod-east-2
  # ...gateway remotes and auth as every member (story 9).
---
# Empties prod-east of every stream, key-value bucket and object store, in
# every account, with their consumers. System-level and whole-cluster only.
# Each stream is moved by $JS.API.ACCOUNT.STREAM.MOVE with the target tags
# (Q2140); there is no bulk primitive, so the controller enumerates.
apiVersion: jetstream.nats.mikluko.io/v1alpha1
kind: NatsClusterEvacuation
metadata:
  name: retire-prod-east
  namespace: nats-system
spec:
  connectionRef:
    name: prod-east-sys   # system credentials
  from:
    cluster: prod-east
  # Must match servers of the target cluster only; refused before any move
  # if a server of `from` carries them too.
  to:
    serverTags: ["cluster:prod-east-2"]
