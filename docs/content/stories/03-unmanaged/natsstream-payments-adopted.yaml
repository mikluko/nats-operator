# The payments NatsStream as `kubectl get -o yaml` shows it after adoption:
# the controller wrote the server's config into spec.
apiVersion: jetstream.nats.mikluko.io/v1beta1
kind: NatsStream
metadata:
  name: payments
  namespace: payments
spec:
  connectionRef:
    name: shared-payments
  adoptionPolicy: Adopt
  name: PAYMENTS
  subjects: ["payments.>"]
  storage: File
  replicas: 3
  retention: Limits
  maxAge: 168h
  maxBytes: -1
  discard: Old
