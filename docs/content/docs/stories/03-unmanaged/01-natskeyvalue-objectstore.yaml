apiVersion: jetstream.nats-operator.io/v1beta1
kind: NatsKeyValue
metadata:
  name: sessions
  namespace: payments
  labels:
    traffic: requests
spec:
  connectionRef:
    name: shared-payments
  adoptionPolicy: AdoptOrCreate
  deletionPolicy: Retain
  name: sessions
  history: 5
  ttl: 24h
  maxValueSize: 64Ki
  maxBytes: 1Gi
  storage: File
  replicas: 3
---
apiVersion: jetstream.nats-operator.io/v1beta1
kind: NatsObjectStore
metadata:
  name: receipts
  namespace: payments
spec:
  connectionRef:
    name: shared-payments
  name: receipts
  ttl: 2160h
  maxBytes: 50Gi
  storage: File
  replicas: 3
  compression: true
