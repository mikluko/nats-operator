apiVersion: jetstream.nats.mikluko.io/v1beta1
kind: NatsStream
metadata:
  name: payments
  namespace: payments
spec:
  connectionRef:
    name: shared-payments
  adoptionPolicy: Adopt
  name: PAYMENTS
  subjects: ["payments.>"]
  storage: File
  replicas: 3
  retention: Limits
  maxAge: 168h0m0s
  maxBytes: "-1"
  discard: Old
