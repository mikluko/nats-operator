apiVersion: cluster.nats.mikluko.io/v1beta1
kind: NatsCluster
metadata:
  name: demo
  namespace: nats-system
spec:
  # `image` sets the repository and a digest, never the tag.
  version: 2.15.0
  replicas: 3

  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      memory: 4Gi
  # GOMEMLIMIT and jetstream.max_memory_store derive from limits.memory;
  # max_file_store derives from the PVC size. The store limits are shown in
  # status and overridable under jetstream.limits.

  jetstream:
    volumeClaimTemplate:
      spec:
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi

  # No `routes` block: route TLS is on by default, and with no certificate
  # named the controller self-signs one. `routes.tls.secretRef` or
  # `routes.tls.certManager.issuerRef` name a route certificate;
  # `routes.tls.enabled: false` turns route TLS off.

  # No `tls` block: clients connect in the clear. `tls.secretRef` or
  # `tls.certManager.issuerRef` put the client listener under TLS, and
  # clients then dial `tls://`.
