# The orders account in the story 6 supercluster, and the orders team's
# connection to it through east.
apiVersion: auth.nats-operator.io/v1beta1
kind: NatsAccount
metadata:
  name: orders
  namespace: nats-system
spec:
  operatorRef:
    name: acme
  limits:
    jetstream:
      memoryStorage: 64Mi
      diskStorage: 8Gi
---
apiVersion: nats-operator.io/v1beta1
kind: NatsReferenceGrant
metadata:
  name: orders-users
  namespace: nats-system
spec:
  from:
    - group: auth.nats-operator.io
      kind: NatsUser
      namespace: orders
  to:
    - group: auth.nats-operator.io
      kind: NatsAccount
      name: orders
---
apiVersion: auth.nats-operator.io/v1beta1
kind: NatsUser
metadata:
  name: acme-orders
  namespace: orders
spec:
  accountRef:
    kind: NatsAccount
    namespace: nats-system
    name: orders
  credentials:
    secretKeyRef:
      name: acme-orders-creds
---
apiVersion: nats-operator.io/v1beta1
kind: NatsConnection
metadata:
  name: acme-orders
  namespace: orders
spec:
  servers: ["nats://east.nats-system.svc:4222"]
  credentials:
    secretKeyRef:
      name: acme-orders-creds
