# The only edit: placement.cluster. Within one supercluster a placement change
# is a move request (nats-server 2.15.0 jetstream_cluster.go:10794): the
# server builds a new group in west, copies the stream and its consumers
# live, then drops the east copies. What publishers and consumers see
# meanwhile is what nats-server provides for a placement move.
apiVersion: jetstream.nats.mikluko.io/v1beta1
kind: NatsStream
metadata:
  name: orders
  namespace: orders
spec:
  connectionRef:
    name: acme-orders
  name: ORDERS
  subjects: ["orders.>"]
  storage: File
  replicas: 3
  placement:
    cluster: west
