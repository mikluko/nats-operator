status:
  observedGeneration: 1
  conditions:
    - type: Ready
      status: "True"
      reason: Balancing
    - type: Holding
      status: "False"
      reason: Settled
    - type: Overlapping
      status: "False"
      reason: PoolsDisjoint
  # REQ_07 in requests; PAYMENTS, from story 4, carries no pool label and
  # falls to the default pool. A pool of one stream is skewed by one
  # whichever server leads it.
  pools:
    - name: requests
      streams: 1
      leaderSkew: 1
    - name: responses
      streams: 0
    - name: (default)
      streams: 1
      leaderSkew: 1
