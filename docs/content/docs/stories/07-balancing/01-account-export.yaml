# What lets the system balancer move this account's leaders. The preset
# expands to two service exports, $JS.API.STREAM.LEADER.STEPDOWN.* and
# $JS.API.CONSUMER.LEADER.STEPDOWN.*.*, and the auth controller adds the
# matching imports to the system account's JWT under a per-account prefix.
# Proven on nats-server 2.15.0 (Q2135). The account is story 4's, limits
# and all; a manifest that left them out would take them away.
apiVersion: auth.nats.mikluko.io/v1beta1
kind: NatsAccount
metadata:
  name: payments
  namespace: nats-system
spec:
  operatorRef:
    name: demo
  limits:
    connections: 200
    jetstream:
      memoryStorage: 512Mi
      diskStorage: 100Gi
      streams: 10
      consumers: 100
  exports:
    - preset: jetstream-stepdown
