---
# What lets the monitoring namespace's users reach the accounts in
# nats-system.
apiVersion: nats.mikluko.io/v1beta1
kind: NatsReferenceGrant
metadata:
  name: monitoring-users
  namespace: nats-system
spec:
  from:
    - group: auth.nats.mikluko.io
      kind: NatsUser
      namespace: monitoring
  to:
    - group: auth.nats.mikluko.io
      kind: NatsAccount
      name: monitoring-prod
    - group: auth.nats.mikluko.io
      kind: NatsAccount
      name: monitoring-dev
