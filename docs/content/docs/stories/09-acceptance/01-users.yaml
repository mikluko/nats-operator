# Every account carries the same two users, `service` and `readonly`. The
# monitoring team's live in its own namespace, admitted by the grant below.
apiVersion: auth.nats.mikluko.io/v1beta1
kind: NatsUser
metadata:
  name: monitoring-prod-service
  namespace: monitoring
spec:
  accountRef:
    kind: NatsAccount
    namespace: nats-system
    name: monitoring-prod
  permissions:
    publish:
      allow: [">"]
    subscribe:
      allow: [">"]
  credentials:
    secretKeyRef:
      name: nats-service-creds
---
# The readonly preset: publish only to the JetStream introspection
# subjects, and subscribe only to replies under `_INBOX.readonly`.
# `permissions` is refused beside a preset.
apiVersion: auth.nats.mikluko.io/v1beta1
kind: NatsUser
metadata:
  name: monitoring-prod-readonly
  namespace: monitoring
spec:
  accountRef:
    kind: NatsAccount
    namespace: nats-system
    name: monitoring-prod
  preset: readonly
  credentials:
    secretKeyRef:
      name: nats-readonly-creds
---
