status:
  observedGeneration: 1
  conditions:
    - type: Ready
      status: "True"
      reason: Balancing
    - type: Holding
      status: "False"
      reason: Settled
    - type: Overlapping
      status: "False"
      reason: PoolsDisjoint
  pools:
    - name: requests
      streams: 1
      leaderSkew: !any 1
    - name: responses
      streams: 1
      leaderSkew: !any 1
