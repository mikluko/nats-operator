status:
  observedGeneration: 1
  conditions:
    - type: Ready
      status: "True"
      reason: Balancing
    - type: Holding
      status: "False"
      reason: Settled
    - type: Overlapping
      status: "False"
      reason: PoolsDisjoint
  # One stream a pool: skewed by one whichever server leads it. Every stream
  # of the account has a resource in a pool, so there is no (default) pool.
  pools:
    - name: requests
      streams: 1
      leaderSkew: !any 1
    - name: responses
      streams: 1
      leaderSkew: !any 1
