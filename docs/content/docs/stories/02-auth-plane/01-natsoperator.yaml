apiVersion: auth.nats.mikluko.io/v1beta1
kind: NatsOperator
metadata:
  name: demo
  namespace: nats-system
spec:
  # No `keys`: the auth controller generates the identity key and one signing
  # key and keeps each seed in a Secret that outlives this object.
  # `keys.identity` and `keys.signing[]` adopt existing seeds instead, and `jwt`
  # with signing keys only keeps the identity offline. Account JWTs are signed
  # with a signing key, never the identity key.

  # The one system account the NATS operator JWT names; NATS allows exactly one.
  # Other NatsSystemAccounts may exist unreferenced: they are not signed and
  # their users get no creds. Flipping this ref is how a system account is
  # rotated, and `system_account` is restart-only, so every server trusting
  # this NATS operator restarts.
  systemAccountRef:
    name: sys
