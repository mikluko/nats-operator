# payments-reader, with no grant covering it. Grants are checked on every
# reconcile, so deleting one later turns an admitted user into this one and
# revokes its JWT.
status:
  observedGeneration: 1
  conditions:
    - type: Ready
      status: "False"
      reason: ReferenceNotPermitted
    - type: ReferencesResolved
      status: "False"
      reason: NoGrant
      message: >-
        no NatsReferenceGrant in nats-system admits NatsUser from namespace
        orders to NatsAccount payments
