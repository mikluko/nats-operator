apiVersion: auth.nats-operator.io/v1beta1
kind: NatsAccount
metadata:
  name: payments
  namespace: nats-system
spec:
  operatorRef:
    name: demo
  limits:
    connections: 200
    jetstream:
      memoryStorage: 512Mi
      diskStorage: 100Gi
      streams: 10
      consumers: 100
---
apiVersion: nats-operator.io/v1beta1
kind: NatsReferenceGrant
metadata:
  name: payments-users
  namespace: nats-system
spec:
  from:
    - group: auth.nats-operator.io
      kind: NatsUser
      namespace: payments
  to:
    - group: auth.nats-operator.io
      kind: NatsAccount
      name: payments
