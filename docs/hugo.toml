baseURL = "https://mikluko.github.io/nats-operator/"
title = "nats-operator"
locale = "en"
theme = "github.com/zkreations/hudocs"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]
enableGitInfo = true

[params]
  description = "Three Kubernetes controllers that deploy NATS clusters, own their auth plane, and manage and balance JetStream."
  docs_versions = false

[outputs]
  home = ["html", "markdown", "llms"]
  section = ["html", "markdown"]
  page = ["html", "markdown"]

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[[menus.main]]
  pageRef = "/docs"
  weight = 1

[[menus.main]]
  name = "GitHub"
  url = "https://github.com/mikluko/nats-operator"
  weight = 2
  [menus.main.params]
    icon = "github"

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[[module.mounts]]
  source = "content"
  target = "content"
  files = ["! docs/stories/*/e2e/**"]

[[module.mounts]]
  source = "design"
  target = "content/docs/design"

[[module.mounts]]
  source = "adr"
  target = "content/docs/adr"
