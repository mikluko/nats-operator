{{- /* A type's name in a code span. */ -}}
{{- $raw := .Get 0 -}}
{{- if .IsNamedParams -}}
{{- $raw = .Get "name" | default (.Get "type") -}}

<code class="type">{{ printf "%v" $raw | strings.TrimSuffix "?" | strings.TrimPrefix "{" | strings.TrimSuffix "}" | strings.TrimSpace }}</code>
